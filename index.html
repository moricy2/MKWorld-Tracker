// ── localStorage 永続化 ──
function gdrive_saveSettings(){
  var tokenToSave = null;
  try{ var tk = gapi.client.getToken(); if(tk && tk.access_token) tokenToSave = tk.access_token; }catch(e){}
  localStorage.setItem(GDRIVE_LS_KEY, JSON.stringify({
    enabled:     gd.enabled,
    fileId:      gd.fileId,
    lastSync:    gd.lastSync,
    tokenExpAt:  gd._tokenExpAt,   // 有効期限を保存
    accessToken: tokenToSave,       // アクセストークン本体（リロード後復元用）
    userEmail:   gd._userEmail,
    userName:    gd._userName,
  }));
}
function gdrive_loadSettings(){
  try{
    var s = JSON.parse(localStorage.getItem(GDRIVE_LS_KEY)||'{}');
    gd.enabled      = !!s.enabled;
    gd.fileId       = s.fileId       || null;
    gd.lastSync     = s.lastSync     || null;
    gd._tokenExpAt  = s.tokenExpAt   || null;
    gd._accessToken = s.accessToken  || null;  // リロード後の復元用
    gd._userEmail   = s.userEmail    || '';
    gd._userName    = s.userName     || '';
  }catch(e){}
}

// ── トークンが（まだ）有効期限内かどうか ──
function gdrive_tokenStillValid(){
  if(!gd._tokenExpAt) return false;
  return Date.now() < gd._tokenExpAt;
}

// ── gapi / GIS スクリプトの動的ロード（一度だけ） ──
function gdrive_loadScripts(cb){
  var pending = 2;
  function done(){ if(--pending === 0) cb(); }
  if(!document.getElementById('_gapi_script')){
    var s = document.createElement('script');
    s.id = '_gapi_script';
    s.src = 'https://apis.google.com/js/api.js';
    s.onload = function(){
      gapi.load('client', function(){
        gapi.client.init({apiKey: GDRIVE_API_KEY, discoveryDocs: []})
          .then(function(){ done(); }).catch(function(){ done(); });
      });
    };
    document.head.appendChild(s);
  } else { done(); }

  if(!document.getElementById('_gis_script')){
    var g = document.createElement('script');
    g.id = '_gis_script';
    g.src = 'https://accounts.google.com/gsi/client';
    g.onload = function(){ done(); };
    document.head.appendChild(g);
  } else { done(); }
}

// ── トークン取得成功後の共通処理 ──
function gdrive_onTokenReceived(tokenResp){
  // expires_in は秒単位
  var expiresIn = parseInt(tokenResp.expires_in || 3599);
  gd._tokenExpAt = Date.now() + (expiresIn - GDRIVE_TOKEN_BUFFER_SEC) * 1000;
  gd.ready       = true;
  gd.needsReauth = false;
  gdrive_saveSettings();
  // ユーザー情報を非同期取得（失敗しても無視）
  fetch('https://www.googleapis.com/oauth2/v3/userinfo',{
    headers:{ Authorization: 'Bearer ' + gapi.client.getToken().access_token }
  }).then(function(r){ return r.json(); }).then(function(u){
    gd._userEmail = u.email || '';
    gd._userName  = u.name  || '';
    gdrive_saveSettings();
    var an = document.getElementById('drive-user-name');
    if(an) an.textContent = gd._userName || gd._userEmail || '—';
  }).catch(function(){});
}

// ── サイレント認証（ポップアップなし） ──
// Googleセッションが存在すれば prompt:'' で裏側でトークン取得できる
function gdrive_silentAuth(cb){
  var tc = google.accounts.oauth2.initTokenClient({
    client_id: GDRIVE_CLIENT_ID,
    scope:     GDRIVE_SCOPE,
    prompt:    '',   // ← ポップアップを出さない
    callback:  function(resp){
      if(resp.error || !resp.access_token){
        // immediate_failed など → サイレント失敗
        cb(false, resp.error || 'silent_failed');
        return;
      }
      gdrive_onTokenReceived(resp);
      cb(true);
    },
  });
  tc.requestAccessToken({ prompt: '' });
}

// ── 明示的サインイン（ポップアップあり / ユーザー操作起点のみ） ──
function gdrive_interactiveAuth(cb){
  var tc = google.accounts.oauth2.initTokenClient({
    client_id: GDRIVE_CLIENT_ID,
    scope:     GDRIVE_SCOPE,
    callback:  function(resp){
      if(resp.error || !resp.access_token){
        cb(false, resp.error);
        return;
      }
      gdrive_onTokenReceived(resp);
      cb(true);
    },
  });
  // prompt:'select_account' でアカウント選択画面を出す
  // 2回目以降は '' にするとスムーズだが select_account の方が確実
  tc.requestAccessToken({ prompt: 'select_account' });
}

// ── 起動時の自動認証フロー ──
// サイレントを試みる → 失敗したら needsReauth フラグだけ立てて UI に任せる
function gdrive_silentInit(cb){
  gdrive_loadScripts(function(){
    // すでにメモリ上にトークンがある（同一タブで再初期化された場合）
    var existing = gapi.client.getToken();
    if(existing && existing.access_token && gdrive_tokenStillValid()){
      gd.ready = true; gd.needsReauth = false;
      if(cb) cb(true); return;
    }
    // リロード後: localStorage に保存済みトークンがあり期限内なら gapi に復元
    if(gd._accessToken && gdrive_tokenStillValid()){
      try{
        gapi.client.setToken({ access_token: gd._accessToken });
        gd.ready = true; gd.needsReauth = false;
        console.info('GDrive: restored token from localStorage');
        if(cb) cb(true); return;
      }catch(e){
        console.warn('GDrive: token restore failed', e);
      }
    }
    // トークンなし / 期限切れ — 自動サイレント認証は行わない（ポップアップ廃止）
    // ユーザーが手動でボタンを押したときだけ gdrive_interactiveAuth() を呼ぶ
    gd.ready       = false;
    gd.needsReauth = true;
    console.info('GDrive: no valid token on startup → waiting for user interaction');
    if(cb) cb(false);
  });
}

// ── 「連携を開始」ボタン（ユーザー操作起点） ──
function gdrive_toggleEnable(){
  if(gd.enabled){
    // 既に連携中 → 解除
    if(!confirm('Google Drive 連携を解除しますか？\nDrive 上のデータは削除されません。')) return;
    var token = gapi.client ? gapi.client.getToken() : null;
    if(token) google.accounts.oauth2.revoke(token.access_token, function(){});
    if(gapi.client) gapi.client.setToken(null);
    gd.enabled = false; gd.ready = false; gd.needsReauth = false;
    gd.fileId = null; gd._tokenExpAt = null; gd._accessToken = null;
    gdrive_saveSettings(); gdrive_updateUI(); return;
  }
  if(GDRIVE_CLIENT_ID === 'YOUR_CLIENT_ID.apps.googleusercontent.com'){
    alert('⚠️ Client ID が設定されていません。\nindex.html 内の GDRIVE_CLIENT_ID を書き換えてください。'); return;
  }
  gd.enabled = true; gdrive_saveSettings(); gdrive_updateUI();
  // 初回 or 再接続: インタラクティブ認証
  gdrive_loadScripts(function(){
    gdrive_interactiveAuth(function(ok){
      if(ok){
        gdrive_updateUI();
        gdrive_fetchRemote(function(data, remoteTs){
          gdrive_checkRemoteNewer(data, remoteTs);
          gdrive_updateUI();
        });
      } else {
        alert('Google 認証に失敗しました。再度お試しください。');
        gd.enabled = false; gd.needsReauth = false;
        gdrive_saveSettings(); gdrive_updateUI();
      }
    });
  });
}

// ── 「再接続」ボタン（needsReauth 時にステータスバーに出る） ──
function gdrive_reconnect(){
  gdrive_loadScripts(function(){
    gdrive_interactiveAuth(function(ok){
      if(ok){
        gd.needsReauth = false;
        gdrive_updateUI();
        gdrive_fetchRemote(function(data, remoteTs){
          gdrive_checkRemoteNewer(data, remoteTs);
          gdrive_updateUI();
        });
      }
    });
  });
}

// ── サインアウト ──
function gdrive_signOut(){
  if(!confirm('Google Drive との連携を切断しますか？\nDrive 上のデータは削除されません。')) return;

function _fmtTime(iso){
  if(!iso) return '—';
  var d = new Date(iso);
  return d.toLocaleDateString('ja-JP',{month:'numeric',day:'numeric'})
       + ' ' + d.toLocaleTimeString('ja-JP',{hour:'2-digit',minute:'2-digit'});
}

// ── Drive API 呼び出しラッパー（401 時に自動リフレッシュ） ──
function gdrive_apiCall(method, url, params, body, _retried){
  var token = gapi.client.getToken();
  if(!token) return Promise.reject('not_signed_in');
  var qs = '';
  if(params){
    var p = Object.entries(params).map(function(kv){
      return encodeURIComponent(kv[0])+'='+encodeURIComponent(kv[1]);
    }).join('&');
    if(p) qs = '?' + p;
  }
  var opts = { method: method, headers: { 'Authorization': 'Bearer '+token.access_token } };
  if(body){ opts.headers['Content-Type'] = 'application/json'; opts.body = JSON.stringify(body); }
  return fetch(url+qs, opts).then(function(r){
    // 401 → トークン期限切れ → サイレント再取得してリトライ（1回だけ）
    if(r.status === 401 && !_retried){
      return new Promise(function(resolve, reject){
        gdrive_silentAuth(function(ok){
          if(ok){ resolve(gdrive_apiCall(method, url, params, body, true)); }
          else  { gd.ready = false; gd.needsReauth = true; gdrive_updateUI(); reject('token_expired'); }
        });
      });
    }
    if(!r.ok) return r.json().then(function(e){ throw e; });
    if(r.status === 204) return null;
    return r.json();
  });
}

// ── ファイル検索 ──
function gdrive_findFile(){
  return gdrive_apiCall('GET','https://www.googleapis.com/drive/v3/files',{
    spaces:'appDataFolder', fields:'files(id,name,modifiedTime)', pageSize:'10',
  }).then(function(res){
    return (res.files||[]).find(function(x){ return x.name === GDRIVE_FILENAME; }) || null;
  });
}

// ── リモートデータ取得 ──
function gdrive_fetchRemote(cb){
  if(!gd.ready){ if(cb)cb(null); return; }
  gdrive_findFile().then(function(f){
    if(!f){ gd.fileId = null; gdrive_saveSettings(); if(cb)cb(null); return; }
    gd.fileId = f.id; gd.remoteTs = f.modifiedTime; gdrive_saveSettings();
    return gdrive_apiCall('GET','https://www.googleapis.com/drive/v3/files/'+f.id,{alt:'media'})
      .then(function(data){ if(cb)cb(data, f.modifiedTime); });
  }).catch(function(e){ console.error('gdrive fetch', e); if(cb)cb(null); });
}

// ── Drive へ書き込み（multipart upload） ──
function gdrive_writeRemote(payload){
  if(!gd.ready || gd.busy) return Promise.resolve();
  gd.busy = true; gdrive_updateUI();
  var content  = JSON.stringify(payload);
  var boundary = 'mkw_bdry_' + Date.now();
  var meta     = { name: GDRIVE_FILENAME, parents: gd.fileId ? undefined : ['appDataFolder'] };
  var body     = '--'+boundary+'\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n'
               + JSON.stringify(meta)
               + '\r\n--'+boundary+'\r\nContent-Type: application/json\r\n\r\n'
               + content + '\r\n--'+boundary+'--';
  var token    = gapi.client.getToken();
  if(!token){ gd.busy = false; gdrive_updateUI(); return Promise.reject('not_signed_in'); }
  var url    = gd.fileId
    ? 'https://www.googleapis.com/upload/drive/v3/files/'+gd.fileId+'?uploadType=multipart'
    : 'https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart';
  var method = gd.fileId ? 'PATCH' : 'POST';
  return fetch(url, {
    method: method,
    headers: { 'Authorization': 'Bearer '+token.access_token,
               'Content-Type': 'multipart/related; boundary='+boundary },
    body: body,
  }).then(function(r){
    if(r.status === 401){
      // トークン切れ → サイレント取得後リトライ
      gd.busy = false;
      return new Promise(function(resolve){
        gdrive_silentAuth(function(ok){
          if(ok) resolve(gdrive_writeRemote(payload));
          else { gd.needsReauth = true; gdrive_updateUI(); resolve(); }
        });
      });
    }
    return r.json();
  }).then(function(res){
    if(res && res.id){ gd.fileId = res.id; }
    gd.lastSync = new Date().toISOString();
    gd.busy = false; gdrive_saveSettings(); gdrive_updateUI();
  }).catch(function(e){
    console.error('gdrive write', e); gd.busy = false; gdrive_updateUI();
  });
}

// ── ペイロード組み立て（画像パス除外） ──
function gdrive_buildPayload(){
  return {
    matchHistory: matchHistory,
    customRoads:  customRoads,
    courseRecords:courseRecords,
    chars:        chars,
    karts:        karts,
    topN24:       topN24,
    topN12:       topN12,

    _savedAt:     new Date().toISOString(),

}

function gdrive_scheduleSave(){
  if(!gd.enabled || !gd.ready) return;
  clearTimeout(gd._saveTimer);
  gd._saveTimer = setTimeout(function(){
    gdrive_writeRemote(gdrive_buildPayload());
  }, GDRIVE_DEBOUNCE_MS);
}

// ── Upload: ローカル → Drive ──
function gdrive_upload(){
  if(!gd.enabled){ alert('Google Drive 連携が有効になっていません。'); return; }
  if(!gd.ready)  { gdrive_reconnect(); return; }
  var lastSyncStr = gd.lastSync ? '\n'+(lang==='en'?'Last sync: ':'最終同期: ') + _fmtTime(gd.lastSync) : '';
  if(!confirm(lang==='en'?'Upload local data to Google Drive?\nExisting Drive data will be overwritten.'+lastSyncStr+'\n\nContinue?':'ローカルのデータを Google Drive にアップロードします。\nDrive 上の既存データは上書きされます。' + lastSyncStr + '\n\n続けますか？')) return;

}

// ── Download: Drive → ローカル ──
function gdrive_download(){
  if(!gd.enabled){ alert('Google Drive 連携が有効になっていません。'); return; }
  if(!gd.ready)  { gdrive_reconnect(); return; }
  if(!confirm(lang==='en'?'Restore data from Google Drive?\nCurrent local data will be lost.\n\nContinue?':'Google Drive からデータを取得してローカルに復元します。\n現在のローカルデータは失われます。\n\n続けますか？')) return;
  gdrive_fetchRemote(function(data, remoteTs){

    gd.remoteData = data; gd.remoteTs = remoteTs;

  });
}

function gdrive_checkOnStartup(){
  if(!gd.enabled) return;
  // サイレント認証を試みる（ポップアップなし）
  gdrive_silentInit(function(ok){
    gdrive_updateUI();

// ===== CORSプロキシ共通ヘルパー =====
// corsproxy.io（直接レスポンス）→ allorigins（JSONラッパー）の順で試みる
async function proxiedFetch(targetUrl){
  var corsProxies=[
    {
      wrap:function(u){ return 'https://corsproxy.io/?url='+encodeURIComponent(u); },
      parse:async function(r){
        if(r.status===404) throw new Error('not_found');
        if(!r.ok) throw new Error('http_'+r.status);
        return r.json();
      }
    },
    {
      wrap:function(u){ return 'https://api.allorigins.win/get?url='+encodeURIComponent(u); },
      parse:async function(r){
        if(!r.ok) throw new Error('proxy_error');
        var w=await r.json();
        if(w.status&&w.status.http_code===404) throw new Error('not_found');
        if(w.status&&w.status.http_code!==200) throw new Error('http_'+w.status.http_code);
        return JSON.parse(w.contents);
      }
    }
  ];
  var lastErr=new Error('接続失敗');
  for(var i=0;i<corsProxies.length;i++){
    try{
      var resp=await fetch(corsProxies[i].wrap(targetUrl));
      return await corsProxies[i].parse(resp);
    }catch(e){
      if(e.message==='not_found') throw e;
      lastErr=e;
    }
  }
  throw lastErr;
}

async function syncMmrData(){
  if(!loungeName){ alert('Lounge名を入力してください'); return; }
  var statusEl=document.getElementById('mmr-sync-status');
  var summaryEl=document.getElementById('mmr-sync-summary');
  statusEl.style.color='var(--text3)';
  statusEl.textContent='同期中…';
  if(summaryEl) summaryEl.style.display='none';

  var syncSeason=(document.getElementById('mmr-sync-season')||{value:'2'}).value||'2';

  try {
    // lounge.mkcentral.com から 24p / 12p 両方のイベントを取得して合算
    var apiEvents=[];
    var modes=['24p','12p'];
    for(var mi=0;mi<modes.length;mi++){
      var _mode=modes[mi];
      var _url='https://lounge.mkcentral.com/api/player/details?name='+encodeURIComponent(loungeName)
        +'&season='+encodeURIComponent(syncSeason)+'&game=mkworld'+_mode;
      try{
        var _d=await proxiedFetch(_url);
        var _evs=(_d.mmrChanges||[]).filter(function(e){ return e.reason==='Table'; });
        _evs.forEach(function(ev){ ev._syncMode=_mode; }); // モードタグ付け
        apiEvents=apiEvents.concat(_evs);
      }catch(me){
        if(me.message!=='not_found') throw me;
      }
    }
    if(apiEvents.length===0) throw new Error('not_found');

    // 再同期対象: currentMmr == null（未照合・未sync 両方を再試行）
    var toSync=matchHistory.filter(function(m){ return m.currentMmr==null; });
    toSync.forEach(function(m){ m.mmrUnmatched=false; }); // 前回フラグをリセット

    // API の ISO 時刻を JST 日付文字列（YYYY-MM-DD）に変換
    function _apiDateJST(isoStr){
      if(!isoStr) return '';
      var d=new Date(isoStr);
      return new Date(d.getTime()+9*3600*1000).toISOString().slice(0,10);
    }

    var matched=0;
    var usedIdx=new Set();
    toSync.forEach(function(m){
      var mMode=m.mode||'24p';
      var mScore=Number(m.totalPts);
      var mTier=(m.tier||'').toUpperCase();

      // --- 候補を全列挙（スコア・ティア・モードが一致 かつ JST日付が±1日以内）---
      var candidates=[];
      for(var i=0;i<apiEvents.length;i++){
        if(usedIdx.has(i)) continue;
        var e=apiEvents[i];
        if(Number(e.score)!==mScore) continue;              // スコア（型安全）
        if((e.tier||'').toUpperCase()!==mTier) continue;    // ティア
        if((e._syncMode||'24p')!==mMode) continue;          // モード
        var eDate=_apiDateJST(e.time);
        var dateDiff=eDate?Math.abs(new Date(eDate)-new Date(m.date)):Infinity;
        if(dateDiff>24*3600*1000) continue;                  // JST日付±1日
        candidates.push({idx:i, dateDiff:dateDiff, e:e});
      }

      if(candidates.length===0){ m.mmrUnmatched=true; return; }

      // 日付が最も近い候補を採用（同日なら先頭 = API返却順）
      candidates.sort(function(a,b){ return a.dateDiff-b.dateDiff; });
      var best=candidates[0];
      var ev=best.e;
      m.mmrChange=ev.mmrDelta!=null?ev.mmrDelta:(ev.mmrChange!=null?ev.mmrChange:0);
      m.currentMmr=ev.newMmr!=null?ev.newMmr:(ev.currentMmr!=null?ev.currentMmr:null);
      usedIdx.add(best.idx);
      matched++;
    });

    var syncedTotal=matchHistory.filter(function(m){ return m.currentMmr!=null; }).length;
    var unmatchedTotal=matchHistory.filter(function(m){ return m.mmrUnmatched&&m.currentMmr==null; }).length;
    var apiExtra=apiEvents.length-usedIdx.size;

    // 同期完了 → Lounge名ロック
    if(!loungeNameLocked){ loungeNameLocked=true; applyLoungeNameLock(); }
    autoSave();
    renderMatches();
    statusEl.style.color='var(--green)';
    statusEl.textContent=(lang==='en'?'Done +':'完了 +')+matched;

    if(summaryEl){
      summaryEl.style.display='flex';
      var _isEn=lang==='en';
      summaryEl.innerHTML=
        '<span style="color:var(--text3)">S'+syncSeason+':</span>'
        +'<span onclick="setMatchFilter(\'synced\')" style="cursor:pointer;padding:2px 8px;border-radius:4px;background:rgba(72,199,142,.12);color:var(--green)">✅ '+syncedTotal+(_isEn?' synced':'件同期済み')+'</span>'
        +(unmatchedTotal>0?'<span onclick="setMatchFilter(\'unmatched\')" style="cursor:pointer;padding:2px 8px;border-radius:4px;background:rgba(255,214,0,.1);color:var(--yellow)">❓ '+unmatchedTotal+(_isEn?' unmatched':'件未照合')+'</span>':'')
        +(apiExtra>0?'<span style="color:var(--text3)">ℹ️ '+(_isEn?'API extra: '+apiExtra:'API余剰'+apiExtra+'件')+'</span>':'');
    }
  } catch(e) {
    statusEl.style.color='#ff8080';
    statusEl.textContent=e.message==='not_found'?'プレイヤーが見つかりません':'同期失敗: '+e.message;
  }
}

function mmrCountryFlag(code){
  if(!code || code.length !== 2) return '';
  return String.fromCodePoint(...[...code.toUpperCase()].map(function(c){ return 0x1F1E6 + c.charCodeAt(0) - 65; }));
}


function renderMmrResult(data, season, mode){
  var resultEl = document.getElementById('mmr-result');

  var flag = mmrCountryFlag(data.countryCode);

  // Table イベントのみ抽出（最新順で返される）

  if(chronological.length >= 2){
    var mmrVals = chronological.map(function(e){ return e.newMmr; });

    }).join(' ');

      + '<polyline fill="none" stroke="'+rankColor+'" stroke-width="2.5" stroke-linejoin="round" points="'+points+'"/>'

    return '<div style="'+rowStyle+'"'+rowOnClick+'>'
      + '<span style="width:74px;color:var(--text3);flex-shrink:0">'+date+'</span>'
      + '<span class="tier-badge tier-'+tier+'" style="font-size:9px;padding:1px 5px;flex-shrink:0">'+tier+'</span>'
      + '<span style="flex:1;color:var(--text2)">Score <strong style="color:var(--text)">'+score+'</strong></span>'
      + '<span style="width:54px;text-align:right;color:var(--text2)">'+e.newMmr+'</span>'
      + '<span style="width:44px;text-align:right;font-weight:800;color:'+deltaColor+'">'+deltaStr+'</span>'
      + '<span style="width:16px;text-align:center">'+tableLink+'</span>'
      + '</div>';
  }).join('');

  // ── プレイヤーカード ──
  function statBox(lbl, val){
    return '<div style="background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);padding:8px 10px">'
      + '<div style="font-size:10px;color:var(--text2);margin-bottom:3px">'+lbl+'</div>'
      + '<div style="font-size:15px;font-weight:800;font-family:var(--font-mk)">'+val+'</div>'
      + '</div>';
  }

  var winRate = data.winRate != null ? (data.winRate * 100).toFixed(1)+'%' : '—';
  var avgScore = data.averageScore != null ? data.averageScore.toFixed(1) : '—';
  var avgLast10 = data.averageLastTen != null ? data.averageLastTen.toFixed(1) : '—';

  resultEl.innerHTML =
    '<div style="background:var(--card);border:2px solid '+rankColor+';border-radius:var(--radius-lg);padding:1.25rem;margin-bottom:12px;box-shadow:0 0 24px '+rankColor+'22">'
    // 名前・MMR
    + '<div style="display:flex;align-items:flex-start;gap:12px;margin-bottom:1rem;flex-wrap:wrap">'
    + '<div style="flex:1;min-width:0">'
    + '<div style="font-family:var(--font-mk);font-size:20px;color:var(--text);display:flex;align-items:center;gap:6px">'
    + flag+' '+data.name
    + '<a href="'+LOUNGE_BASE+'/mkworld/PlayerDetails/'+data.playerId+'?p='+(mode==='12p'?'1':'2')+'" target="_blank" style="font-size:10px;color:var(--blue);text-decoration:none;font-weight:700;padding:2px 6px;border:1px solid var(--blue);border-radius:4px;font-family:var(--font);flex-shrink:0">Lounge ↗</a>'
    + '</div>'
    + '<div style="font-size:12px;color:'+rankColor+';margin-top:4px;font-weight:700">'+(data.rank||'—')+(data.countryCode?' · '+data.countryCode:'')+'</div>'
    + '</div>'
    + '<div style="text-align:right;flex-shrink:0">'
    + '<div style="font-family:var(--font-mk);font-size:30px;line-height:1;color:'+rankColor+'">'+(data.mmr!=null?data.mmr:'—')+'</div>'
    + '<div style="font-size:10px;color:var(--text3);letter-spacing:1px">MMR · S'+season+' '+mode.toUpperCase()+'</div>'
    + '</div>'
    + '</div>'
    // スタッツグリッド
    + '<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(90px,1fr));gap:8px">'
    + statBox(lang==='en'?'Matches':'試合数', data.eventsPlayed!=null?data.eventsPlayed:'—')
    + statBox(lang==='en'?'Peak MMR':'最高MMR', data.maxMmr!=null?data.maxMmr:'—')
    + statBox(lang==='en'?'Win Rate':'勝率', winRate)
    + statBox(lang==='en'?'Avg Score':'平均Score', avgScore)
    + statBox(lang==='en'?'Last 10':'直近10', data.winLossLastTen||'—')
    + statBox(lang==='en'?'Last 10 Avg':'直近平均', avgLast10)
    + '</div>'
    // チャート
    + chartHtml
    // 変動テーブル
    + (recentEvents.length
      ? '<div style="font-size:10px;font-weight:700;color:var(--text3);letter-spacing:1px;text-transform:uppercase;margin:12px 0 4px">'+(lang==='en'?'Last '+recentEvents.length+' matches':'直近'+recentEvents.length+'試合の変動')+'</div>'
        + '<div style="display:flex;gap:8px;font-size:10px;font-weight:700;color:var(--text3);padding:4px 0;border-bottom:1px solid var(--border);margin-bottom:2px">'
        + '<span style="width:74px">'+(lang==='en'?'Date':'日付')+'</span><span style="width:36px">Tier</span><span style="flex:1">Score</span>'
        + '<span style="width:54px;text-align:right">MMR</span><span style="width:44px;text-align:right">'+(lang==='en'?'Δ':'変動')+'</span><span style="width:16px"></span>'
        + '</div>'
        + tableRowsHtml
      : '')
    + '</div>';
}

</script>
</body>
</html>
