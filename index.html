<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mario Kart World Lounge Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --red:#E8303A;--red2:#c4242d;
  --blue:#1a6fc4;--blue2:#1459a0;
  --yellow:#F5C518;--yellow2:#d4a900;
  --green:#2eaa4a;--green2:#228a3a;
  --bg:#0f1923;--bg2:#162130;--bg3:#1e2e40;
  --card:#1e2e40;--card2:#243548;
  --text:#f0ede8;--text2:#9ab0c8;--text3:#5a7a96;
  --border:#2a3f56;--border2:#3a5570;
  --radius:10px;--radius-lg:16px;
  --font:'Nunito',system-ui,sans-serif;
  --font-mk:'Fredoka One',system-ui,sans-serif;
  --shadow:0 4px 24px rgba(0,0,0,.4);
}
body{background:var(--bg);color:var(--text);font-family:var(--font);font-size:14px;min-height:100vh;overflow-x:hidden}
body::before{content:'';position:fixed;inset:0;background:repeating-linear-gradient(180deg,transparent 0px,transparent 60px,rgba(255,255,255,.015) 60px,rgba(255,255,255,.015) 62px);pointer-events:none;z-index:0;animation:road 6s linear infinite}
@keyframes road{0%{background-position:0 0}100%{background-position:0 62px}}
.container{max-width:820px;margin:0 auto;padding:1.5rem 1rem;position:relative;z-index:1}
.mk-header{text-align:left;margin-bottom:1.5rem;padding:1.4rem 1.8rem;background:var(--bg2);border-radius:var(--radius-lg);border:1px solid var(--border2);position:relative;overflow:hidden;display:flex;align-items:center;gap:1.2rem}
.mk-header::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:linear-gradient(180deg,#fff 0%,var(--text2) 100%)}
.mk-header::after{content:'';position:absolute;inset:0;background:radial-gradient(ellipse at 0% 50%,rgba(255,255,255,.04) 0%,transparent 60%);pointer-events:none}
.mk-header-icon{font-size:32px;flex-shrink:0;opacity:.9}
.mk-header-body{flex:1}
.mk-header-title{font-family:var(--font-mk);font-size:22px;color:var(--text);letter-spacing:3px;text-transform:uppercase;margin-bottom:5px;line-height:1}
.mk-header-sub{font-size:10px;color:var(--text3);font-weight:700;letter-spacing:3px;text-transform:uppercase}
.mk-header-badge{flex-shrink:0;display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.mk-header-badge-item{font-size:9px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:var(--text3);padding:3px 8px;border:1px solid var(--border2);border-radius:4px}
.metrics{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-bottom:1.25rem}
.mc{background:var(--card);border:1.5px solid var(--border);border-radius:var(--radius);padding:14px 16px;position:relative;overflow:hidden;transition:transform .2s,border-color .2s}
.mc:hover{transform:translateY(-2px);border-color:var(--border2)}
.mc::before{content:'';position:absolute;top:0;left:0;right:0;height:3px}
.mc:nth-child(1)::before{background:var(--yellow)}
.mc:nth-child(2)::before{background:var(--blue)}
.mc:nth-child(3)::before{background:var(--green)}
.mc:nth-child(4)::before{background:var(--red)}
.mc-lbl{font-size:11px;color:var(--text2);margin-bottom:6px;font-weight:600;letter-spacing:.5px}
.mc-val{font-size:24px;font-weight:800;font-family:var(--font-mk)}
.mc-sub{font-size:11px;color:var(--text3);margin-top:3px}
.tabs{display:flex;gap:4px;margin-bottom:1.25rem;background:var(--bg2);padding:5px;border-radius:var(--radius);border:1.5px solid var(--border)}
.tab{flex:1;padding:8px 4px;font-size:12px;font-weight:700;border-radius:8px;border:none;background:transparent;color:var(--text2);cursor:pointer;transition:all .2s;white-space:nowrap;font-family:var(--font)}
.tab.on{background:var(--red);color:#fff;box-shadow:0 2px 8px rgba(232,48,58,.4)}
.tab:hover:not(.on){background:var(--bg3);color:var(--text)}
/* 試合入力 */
.session-panel{background:var(--card);border:2px solid var(--blue);border-radius:var(--radius-lg);padding:1.25rem;margin-bottom:1rem;box-shadow:0 0 20px rgba(26,111,196,.2)}
.session-hdr{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:1rem;flex-wrap:wrap;gap:8px}
.session-title{font-family:var(--font-mk);font-size:17px;color:var(--yellow)}
.session-prog{font-size:12px;color:var(--text2);margin-top:2px}
.progress-bar{width:100%;height:8px;background:var(--bg);border-radius:4px;margin-bottom:1rem;overflow:hidden;border:1px solid var(--border)}
.progress-fill{height:100%;background:linear-gradient(90deg,var(--blue),var(--yellow));border-radius:4px;transition:width .4s cubic-bezier(.4,0,.2,1)}
.session-summary{display:flex;gap:16px;padding:10px 14px;background:var(--bg2);border-radius:var(--radius);margin-bottom:1rem;flex-wrap:wrap;border:1px solid var(--border)}
.ss-item{font-size:11px;color:var(--text2);font-weight:600}
.ss-val{font-size:15px;font-weight:800;font-family:var(--font-mk)}
.race-row{display:flex;align-items:center;gap:8px;padding:8px 6px;border-bottom:1px solid var(--border);transition:background .15s}
.race-row:hover{background:var(--bg3)}
.race-num{font-size:11px;font-weight:700;color:var(--text3);width:22px;text-align:center}
.race-course{flex:1;font-size:12px;font-weight:600;display:flex;align-items:center;gap:5px}
.race-thumb{width:38px;height:20px;object-fit:cover;border-radius:3px;flex-shrink:0}
.race-pts{font-size:11px;color:var(--yellow);width:40px;text-align:right;font-weight:700}
.race-del{font-size:11px;color:var(--text3);background:none;border:none;cursor:pointer;padding:2px 5px;border-radius:4px;transition:all .15s}
.race-del:hover{color:#ff6b6b;background:rgba(255,107,107,.15)}
/* コースピッカー */
.picker-label{font-size:11px;font-weight:700;color:var(--text2);letter-spacing:1px;text-transform:uppercase;margin-bottom:10px;margin-top:16px}
.course-picker-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px;max-height:320px;overflow-y:auto;padding:2px;scrollbar-width:thin;scrollbar-color:var(--border) transparent}
.course-picker-grid::-webkit-scrollbar{width:6px}
.course-picker-grid::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}
.cp-card{background:var(--bg2);border:2px solid var(--border);border-radius:var(--radius);overflow:hidden;cursor:pointer;transition:all .18s;position:relative}
.cp-card:hover{border-color:var(--yellow);transform:translateY(-2px);box-shadow:0 4px 16px rgba(245,197,24,.2)}
.cp-card.cp-sel{border-color:var(--yellow);background:rgba(245,197,24,.1);box-shadow:0 0 16px rgba(245,197,24,.35)}
.cp-card.used{border-color:#c4242d!important;opacity:.7}
.cp-card.used:hover{border-color:#E8303A!important;box-shadow:0 0 12px rgba(232,48,58,.35)!important;transform:translateY(-2px)}

.tier-picker{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}
.tier-btn{padding:7px 10px;font-size:13px;font-weight:800;font-family:var(--font-mk);border-radius:8px;border:2px solid var(--border);background:var(--bg2);color:var(--text2);cursor:pointer;transition:all .18s;min-width:42px;text-align:center}
.tier-btn:hover{transform:translateY(-2px)}
.tier-btn.t-sel{transform:scale(1.12);box-shadow:0 2px 14px rgba(0,0,0,.4)}
/* tier colors */
.tier-X{border-color:#ff4ecd;color:#ff4ecd}.tier-X.t-sel{background:#ff4ecd;color:#1a0015}
.tier-S{border-color:#ff6b35;color:#ff6b35}.tier-S.t-sel{background:#ff6b35;color:#1a0800}
.tier-A{border-color:#F5C518;color:#F5C518}.tier-A.t-sel{background:#F5C518;color:#1a1200}
.tier-B{border-color:#5dca8a;color:#5dca8a}.tier-B.t-sel{background:#5dca8a;color:#001a0e}
.tier-BC{border-color:#4ab89a;color:#4ab89a}.tier-BC.t-sel{background:#4ab89a;color:#001510}
.tier-C{border-color:#378ADD;color:#378ADD}.tier-C.t-sel{background:#378ADD;color:#001020}
.tier-CD{border-color:#5a7acc;color:#5a7acc}.tier-CD.t-sel{background:#5a7acc;color:#00081a}
.tier-D{border-color:#8a7acc;color:#8a7acc}.tier-D.t-sel{background:#8a7acc;color:#08001a}
.tier-DE{border-color:#aa6aaa;color:#aa6aaa}.tier-DE.t-sel{background:#aa6aaa;color:#150015}
.tier-E{border-color:#cc6688;color:#cc6688}.tier-E.t-sel{background:#cc6688;color:#1a0010}
.tier-EF{border-color:#aaaaaa;color:#aaaaaa}.tier-EF.t-sel{background:#aaaaaa;color:#111}
.tier-F{border-color:#666;color:#888}.tier-F.t-sel{background:#666;color:#eee}
.tier-SQ{border-color:#00e5ff;color:#00e5ff}.tier-SQ.t-sel{background:#00e5ff;color:#001a1f}
/* tier badge in match card */
.tier-badge{display:inline-block;padding:2px 8px;border-radius:8px;font-size:11px;font-weight:800;font-family:var(--font-mk);border:1.5px solid}

.cp-warn{position:absolute;bottom:0;left:0;right:0;background:rgba(196,36,45,.88);color:#fff;font-size:9px;font-weight:700;text-align:center;padding:3px 0;letter-spacing:.5px}
.cp-card.road-type{border-style:dashed}
.cp-thumb{width:100%;aspect-ratio:600/315;object-fit:cover;display:block}
.cp-thumb-ph{width:100%;aspect-ratio:600/315;display:flex;align-items:center;justify-content:center;font-size:22px}

/* 道中コース CSS重ね合わせ */
.road-img-wrap{position:relative;width:100%;aspect-ratio:600/315;overflow:hidden;display:block}
.road-img-bg{width:100%;height:100%;object-fit:cover;display:block}
.road-img-fg{position:absolute;top:0;left:0;width:50%;aspect-ratio:600/315;object-fit:cover;object-position:right center;border-right:2px solid rgba(255,255,255,0.7);border-bottom:2px solid rgba(255,255,255,0.7)}
.cp-name{font-size:11px;font-weight:700;padding:5px 7px;line-height:1.3;color:var(--text)}
.cp-used-lbl{position:absolute;top:4px;right:4px;background:rgba(0,0,0,.7);color:#aaa;font-size:9px;padding:2px 5px;border-radius:8px;font-weight:700}
.cp-road-lbl{position:absolute;top:4px;left:4px;background:rgba(0,0,0,.7);color:var(--yellow);font-size:9px;padding:2px 5px;border-radius:8px;font-weight:700}
/* 順位グリッド */
.rank-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.rank-btn{padding:9px 4px;font-size:14px;font-weight:800;font-family:var(--font-mk);border-radius:8px;border:2px solid var(--border);background:var(--bg2);color:var(--text2);cursor:pointer;transition:all .15s;text-align:center}
.rank-btn:hover{border-color:var(--yellow);color:var(--yellow)}
.rank-btn.top3{border-color:rgba(245,197,24,.4);color:var(--yellow)}
.rank-btn.top12{border-color:rgba(46,170,74,.4);color:#5dca8a}
.rank-btn.rk-sel{background:var(--yellow);border-color:var(--yellow2);color:#1a1200;transform:scale(1.1);box-shadow:0 2px 14px rgba(245,197,24,.5)}
.add-race-btn{width:100%;margin-top:14px;padding:13px;font-size:14px;font-weight:800;font-family:var(--font-mk);border-radius:var(--radius);border:none;background:linear-gradient(135deg,var(--green),var(--green2));color:#fff;cursor:pointer;transition:all .2s;letter-spacing:.5px;box-shadow:0 3px 12px rgba(46,170,74,.3)}
.add-race-btn:hover{transform:translateY(-2px);box-shadow:0 5px 20px rgba(46,170,74,.45)}
.add-race-btn:active{transform:scale(.97)}
.add-race-btn:disabled{opacity:.35;cursor:default;transform:none;box-shadow:none}
.finish-btn{width:100%;padding:15px;font-size:16px;font-weight:800;font-family:var(--font-mk);border-radius:var(--radius);border:3px solid var(--yellow2);background:linear-gradient(135deg,var(--yellow),var(--yellow2));color:#1a1200;cursor:pointer;transition:all .2s;letter-spacing:.5px;animation:glow 2s ease-in-out infinite;margin-top:10px}
@keyframes glow{0%,100%{box-shadow:0 4px 20px rgba(245,197,24,.35)}50%{box-shadow:0 4px 36px rgba(245,197,24,.75)}}
.finish-btn:hover{transform:translateY(-2px) scale(1.01)}
.reset-btn{padding:6px 12px;font-size:11px;font-weight:700;border-radius:8px;border:1.5px solid #ff6b6b;background:transparent;color:#ff6b6b;cursor:pointer;transition:all .15s}
.reset-btn:hover{background:rgba(255,107,107,.15)}
/* コース戦績カード — cp-cardと同等の縦横比に */
.course-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px;margin-bottom:1.25rem}
.ccard{background:var(--card);border:1.5px solid var(--border);border-radius:var(--radius);overflow:hidden;cursor:pointer;transition:all .18s;position:relative;display:flex;align-items:stretch}
.ccard:hover{border-color:var(--yellow);box-shadow:0 2px 10px rgba(245,197,24,.2)}
.ccard.sel{border:2px solid var(--yellow);box-shadow:0 0 12px rgba(245,197,24,.3)}
.ccard.road-type{border-style:dashed}
/* サムネは左側に固定幅で配置 */
.cthumb-wrap{flex-shrink:0;width:68px;position:relative;overflow:hidden}
.cthumb{width:68px;height:100%;object-fit:cover;display:block;min-height:36px}
.cthumb-ph{width:68px;min-height:36px;display:flex;align-items:center;justify-content:center;font-size:18px;background:var(--bg2)}
/* 道中コース用ラッパー（左固定） */
.cthumb-wrap .road-img-wrap{width:68px;height:100%;min-height:36px;aspect-ratio:unset}
.cthumb-wrap .road-img-bg{width:68px;height:100%;object-fit:cover;object-position:right center}
.cthumb-wrap .road-img-fg{width:50%;object-position:left center}
.img-btn{position:absolute;top:2px;right:2px;background:rgba(0,0,0,.65);color:#fff;border:none;border-radius:4px;padding:2px 5px;font-size:9px;font-weight:700;cursor:pointer;opacity:0;transition:opacity .15s;z-index:2}
.ccard:hover .img-btn{opacity:1}
.road-badge{position:absolute;bottom:2px;left:2px;background:rgba(0,0,0,.65);color:var(--yellow);font-size:8px;padding:1px 4px;border-radius:4px;font-weight:700;z-index:2}
/* 右側テキスト */
.cinfo{flex:1;padding:4px 6px;display:flex;flex-direction:column;justify-content:center;min-width:0;overflow:hidden}
.cname{font-size:10px;font-weight:700;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:2px}
.cmeta{display:flex;align-items:center;gap:3px;flex-wrap:wrap}
.ccup{font-size:9px;color:var(--text3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* 道モード */
.road-mode-bar{display:flex;align-items:center;gap:8px;padding:10px 12px;background:rgba(159,225,203,.08);border:1.5px solid rgba(159,225,203,.35);border-radius:var(--radius);margin-bottom:10px;flex-wrap:wrap}
.road-mode-btn{padding:7px 14px;font-size:12px;font-weight:800;border-radius:8px;border:2px solid var(--border2);background:var(--bg2);color:var(--text2);cursor:pointer;transition:all .18s;font-family:var(--font-mk)}
.road-mode-btn.on{border-color:#9FE1CB;background:rgba(159,225,203,.18);color:#9FE1CB;box-shadow:0 0 12px rgba(159,225,203,.25)}
.road-mode-step{font-size:11px;color:#9FE1CB;font-weight:700}
.road-sel-from,.road-sel-to{display:inline-flex;align-items:center;gap:5px;padding:3px 8px;border-radius:6px;font-size:11px;font-weight:700;background:var(--bg);border:1px solid var(--border2)}
.road-sel-img{width:52px;height:28px;object-fit:cover;border-radius:4px;flex-shrink:0}
.road-sel-from.filled{border-color:#9FE1CB;color:#9FE1CB}
.road-sel-to.filled{border-color:var(--yellow);color:var(--yellow)}
.cp-card.road-from-sel{border-color:#9FE1CB!important;background:rgba(159,225,203,.12)!important;box-shadow:0 0 12px rgba(159,225,203,.3)!important}
.cp-card.road-to-sel{border-color:var(--yellow)!important;background:rgba(245,197,24,.1)!important;box-shadow:0 0 12px rgba(245,197,24,.3)!important}
.badge{font-size:10px;font-weight:700;padding:2px 7px;border-radius:10px}
.b-none{background:var(--bg);color:var(--text3)}
.b-top{background:#3d2800;color:#F5C518;border:1px solid #F5C518}
.b-mid{background:#0d2e14;color:#2eaa4a;border:1px solid #2eaa4a}
.b-low{background:#2e0d0d;color:#ff6b6b;border:1px solid #ff6b6b}
.detail{background:var(--card);border:1.5px solid var(--border);border-radius:var(--radius-lg);padding:1.25rem;margin-bottom:1.25rem}
.d-hdr{display:flex;align-items:center;gap:12px;margin-bottom:1rem;flex-wrap:wrap}
.d-thumb{width:80px;height:42px;object-fit:cover;border-radius:8px;border:1.5px solid var(--border)}
.d-name{font-size:16px;font-weight:800;font-family:var(--font-mk)}
.d-cup{font-size:12px;color:var(--text2);margin-top:2px}
.dstats{display:grid;grid-template-columns:repeat(auto-fit,minmax(90px,1fr));gap:8px;margin-bottom:1rem}
.ds{background:var(--bg2);border-radius:var(--radius);padding:10px 12px;border:1px solid var(--border)}
.ds-l{font-size:10px;color:var(--text2);margin-bottom:4px;font-weight:600}
.ds-v{font-size:16px;font-weight:800;font-family:var(--font-mk)}
.hist-row{display:flex;align-items:center;gap:8px;padding:7px 0;border-bottom:1px solid var(--border)}
.h-num{width:18px;color:var(--text3);text-align:center;font-size:11px;font-weight:700}
.h-date{color:var(--text3);flex:1;font-size:11px}
.del-btn{font-size:10px;color:var(--text3);background:none;border:none;cursor:pointer;padding:2px 4px;border-radius:4px;transition:all .15s}
.del-btn:hover{color:#ff6b6b;background:rgba(255,107,107,.15)}
.rk-pill{padding:2px 8px;border-radius:10px;font-size:10px;font-weight:700}
.rk1{background:#3d2800;color:#F5C518;border:1px solid #F5C518}
.rk2{background:#1a2a3a;color:#85B7EB;border:1px solid #4a8cc4}
.rk3{background:#0d2e14;color:#5dca8a;border:1px solid #2eaa4a}
.rk12{background:#1e2e40;color:#9ab0c8}
.rk-e{background:var(--bg2);color:var(--text3)}
/* 試合履歴 */
.match-card{background:var(--card);border:1.5px solid var(--border);border-radius:var(--radius-lg);padding:1rem 1.25rem;margin-bottom:10px;cursor:pointer;transition:all .2s}
.match-card:hover{border-color:var(--border2);transform:translateY(-1px)}
.match-hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:4px}
.match-no{font-size:13px;font-weight:800;font-family:var(--font-mk)}
.match-pts{font-size:20px;font-weight:800;font-family:var(--font-mk)}
.pts-high{color:var(--yellow)}.pts-mid{color:#85B7EB}.pts-low{color:var(--text2)}
.match-sub{font-size:11px;color:var(--text2)}
.match-detail{margin-top:10px;padding-top:10px;border-top:1px solid var(--border)}
.match-race-row{display:flex;align-items:center;gap:8px;padding:4px 0;font-size:11px;color:var(--text2)}
/* ランキング・グラフ */
.sort-bar{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}
.sort-btn{padding:5px 12px;font-size:11px;font-weight:700;border-radius:8px;border:1.5px solid var(--border);background:transparent;color:var(--text2);cursor:pointer;transition:all .15s}
.sort-btn.on{background:var(--blue);border-color:var(--blue2);color:#fff}
.rnk-row{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--border)}
.bar-row{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.bar-lbl{font-size:11px;color:var(--text2);width:140px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600}
.bar-track{flex:1;height:8px;background:var(--bg);border-radius:4px;overflow:hidden;border:1px solid var(--border)}
.bar-avg{height:100%;border-radius:4px;background:linear-gradient(90deg,var(--blue),#85B7EB);transition:width .5s cubic-bezier(.4,0,.2,1)}
.bar-rate{height:100%;border-radius:4px;background:linear-gradient(90deg,var(--green),#5dca8a);transition:width .5s cubic-bezier(.4,0,.2,1)}
.bar-val{font-size:11px;font-weight:700;width:44px;text-align:right}
.empty{text-align:center;padding:2.5rem;color:var(--text3);font-size:13px}
.sec-lbl{font-size:11px;font-weight:700;color:var(--text2);letter-spacing:1px;text-transform:uppercase}
/* モーダル */
.mbg{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:99;display:flex;align-items:flex-start;justify-content:center;padding-top:40px;overflow-y:auto}
.modal{background:var(--card2);border-radius:var(--radius-lg);border:1.5px solid var(--border2);padding:1.5rem;width:340px;max-height:85vh;overflow-y:auto;margin-bottom:40px;box-shadow:var(--shadow)}
.modal-title{font-family:var(--font-mk);font-size:16px;color:var(--yellow);margin-bottom:.75rem}
.modal-note{font-size:12px;color:var(--text2);margin-bottom:1rem;padding:8px 10px;background:var(--bg2);border-radius:var(--radius);line-height:1.5;border:1px solid var(--border)}
.fr{margin-bottom:10px}
.fl{font-size:11px;color:var(--text2);margin-bottom:4px;display:block;font-weight:600}
.fr select,.fr input{width:100%;font-size:13px;padding:8px 10px;border:1.5px solid var(--border2);border-radius:var(--radius);background:var(--bg2);color:var(--text);outline:none;font-family:var(--font)}
.fr select:focus,.fr input:focus{border-color:var(--blue)}
.mact{display:flex;gap:8px;justify-content:flex-end;margin-top:1rem}
.bc{padding:8px 16px;font-size:12px;font-weight:700;border-radius:8px;border:1.5px solid var(--border2);background:transparent;color:var(--text2);cursor:pointer;font-family:var(--font)}
.bs{padding:8px 16px;font-size:12px;font-weight:700;border-radius:8px;border:none;background:var(--blue);color:#fff;cursor:pointer;font-family:var(--font)}
.bs-r{padding:8px 16px;font-size:12px;font-weight:700;border-radius:8px;border:none;background:#c4242d;color:#fff;cursor:pointer;font-family:var(--font)}
.img-prev{width:100%;height:75px;object-fit:cover;border-radius:var(--radius);margin-top:6px;display:none}
.save-bar{position:sticky;bottom:0;background:var(--bg);padding:.75rem 0;display:flex;gap:8px;justify-content:flex-end;border-top:1.5px solid var(--border);margin-top:1rem}
.save-btn{display:inline-flex;align-items:center;gap:5px;padding:8px 14px;font-size:12px;font-weight:700;border-radius:8px;border:1.5px solid var(--border2);background:var(--bg2);color:var(--text);cursor:pointer;transition:all .15s;font-family:var(--font)}
.save-btn:hover{border-color:var(--yellow);color:var(--yellow)}
@keyframes slideIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.anim-slide{animation:slideIn .2s ease-out}
/* Accordion detail */
.course-row{margin-bottom:8px}
.course-row-detail{display:none;margin-top:6px;animation:slideIn .2s ease-out}
.course-row-detail.open{display:block}
/* スマホ: バーグラフ2列 */
@media(max-width:600px){
  .bar-lbl{width:80px;font-size:10px}
  .bar-val{width:34px;font-size:10px}
  .tier-row-stats{gap:8px}
  .tier-row-stat{font-size:10px}
  .tier-row-stat span{font-size:12px}
  .mc-val{font-size:18px}
  .tabs{gap:3px}
  .tab{font-size:11px;padding:6px 3px}
  .tier-summary-grid{grid-template-columns:repeat(2,1fr)!important}
  .metrics{grid-template-columns:repeat(2,1fr)!important}
  .course-picker-grid{grid-template-columns:repeat(2,1fr)!important}
  .course-grid{grid-template-columns:repeat(2,1fr)!important}
  .modal-setup-grid{grid-template-columns:repeat(3,1fr)!important}
  .rank-grid{grid-template-columns:repeat(6,1fr)!important}
}
/* キャラ・マシン設定 */
.setup-panel{background:var(--bg2);border:1.5px solid var(--border);border-radius:var(--radius);padding:14px 16px;margin-bottom:1rem}
.setup-row{display:flex;gap:16px;flex-wrap:wrap}
.setup-item{flex:1;min-width:140px}
.setup-label{font-size:10px;font-weight:700;color:var(--text3);letter-spacing:1px;text-transform:uppercase;margin-bottom:8px}
.setup-card{display:flex;align-items:center;gap:10px;background:var(--bg);border:1.5px solid var(--border2);border-radius:var(--radius);padding:8px 10px;cursor:pointer;transition:all .15s}
.setup-card:hover{border-color:var(--yellow)}
.setup-img{object-fit:contain;border-radius:6px;background:var(--card);flex-shrink:0}
.setup-img.char-img{width:33px;height:44px}
.setup-img.kart-img{width:61px;height:44px}
.setup-img-ph{width:44px;height:44px;border-radius:6px;background:var(--card);display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0}
.setup-name{font-size:12px;font-weight:700;color:var(--text);line-height:1.3}
.setup-hint{font-size:10px;color:var(--text3);margin-top:2px}
/* 設定モーダル */
.modal-setup-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(70px,1fr));gap:8px;max-height:320px;overflow-y:auto;padding:2px;scrollbar-width:thin;scrollbar-color:var(--border) transparent;justify-items:center}
.modal-setup-grid.kart-grid{grid-template-columns:repeat(4,1fr);justify-items:center}
.modal-setup-grid::-webkit-scrollbar{width:5px}
.modal-setup-grid::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}
.setup-opt{background:var(--bg2);border:1.5px solid var(--border);border-radius:var(--radius);padding:8px 6px;cursor:pointer;text-align:center;transition:all .15s}
.setup-opt:hover{border-color:var(--yellow);transform:translateY(-1px)}
.setup-opt.opt-sel{border-color:var(--yellow);background:rgba(245,197,24,.1)}
.setup-opt-img{object-fit:contain;margin:0 auto 4px;display:block;border-radius:4px;background:var(--card)}
.setup-opt-img.char-img{width:38px;height:50px}
.setup-opt-img.kart-img{width:70px;height:50px}
.setup-opt-img-ph{width:44px;height:44px;margin:0 auto 4px;display:flex;align-items:center;justify-content:center;font-size:24px;border-radius:4px;background:var(--card)}
.setup-opt-name{font-size:9px;font-weight:700;color:var(--text2);line-height:1.3;word-break:keep-all}
.setup-edit-btn{font-size:9px;padding:2px 6px;border-radius:4px;border:1px solid var(--border2);background:transparent;color:var(--text3);cursor:pointer;margin-top:4px;font-family:var(--font)}
.setup-edit-btn:hover{color:var(--yellow);border-color:var(--yellow)}
/* tier analysis */
.tier-row{display:flex;align-items:stretch;gap:0;margin-bottom:10px;border-radius:var(--radius);overflow:hidden;border:1px solid var(--border)}
.tier-row-label{width:52px;display:flex;align-items:center;justify-content:center;font-family:var(--font-mk);font-size:15px;font-weight:800;flex-shrink:0;border-right:1px solid var(--border)}
.tier-row-body{flex:1;padding:10px 14px;background:var(--card)}
.tier-row-stats{display:flex;gap:16px;margin-bottom:8px;flex-wrap:wrap}
.tier-row-stat{font-size:11px;color:var(--text2)}
.tier-row-stat span{font-size:14px;font-weight:800;font-family:var(--font-mk);color:var(--text);margin-left:4px}
.tier-mini-bar-wrap{display:flex;align-items:center;gap:8px;margin-bottom:5px}
.tier-mini-label{font-size:10px;color:var(--text3);width:60px;font-weight:600}
.tier-mini-track{flex:1;height:6px;background:var(--bg);border-radius:3px;overflow:hidden}
.tier-mini-fill{height:100%;border-radius:3px;transition:width .5s cubic-bezier(.4,0,.2,1)}
.tier-mini-val{font-size:10px;font-weight:700;width:36px;text-align:right;color:var(--text2)}
.tier-no-data{font-size:11px;color:var(--text3);font-style:italic;padding:4px 0}
.tier-section-title{font-size:11px;font-weight:700;color:var(--text2);letter-spacing:1px;text-transform:uppercase;margin-bottom:12px;margin-top:4px}
.tier-summary-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;margin-bottom:1.5rem}
.tier-summary-card{background:var(--card);border:1.5px solid var(--border);border-radius:var(--radius);padding:12px 14px}
.tier-pts-bar-wrap{margin-top:4px}
@keyframes barGrow{from{width:0}to{width:var(--w)}}
</style>
</head>
<body>
<div class="container">
<div class="mk-header">
  <div class="mk-header-icon">🏎</div>
  <div class="mk-header-body">
    <div class="mk-header-title">Mario Kart World Lounge Tracker</div>
    <div class="mk-header-sub" id="hdr-sub">Mario Kart World Lounge &nbsp;·&nbsp; 24人 VS &nbsp;·&nbsp; 12 Race</div>
  </div>
  <div class="mk-header-badge">
    <div class="mk-header-badge-item">VS 24</div>
    <button id="lang-toggle" onclick="toggleLang()" style="font-size:11px;font-weight:800;padding:4px 10px;border-radius:6px;border:1.5px solid var(--border2);background:var(--bg2);color:var(--text2);cursor:pointer;font-family:var(--font-mk);letter-spacing:1px;margin-top:4px">EN</button>
  </div>
</div>
<div class="metrics" id="metrics"></div>
<div class="tabs">
  <button class="tab on" id="tab-btn-session" onclick="switchTab('session')">🏁 <span data-i18n="tab_session">試合入力</span></button>
  <button class="tab" id="tab-btn-courses" onclick="switchTab('courses')">🗺 <span data-i18n="tab_courses">コース戦績</span></button>
  <button class="tab" id="tab-btn-matches" onclick="switchTab('matches')">📋 <span data-i18n="tab_matches">試合履歴</span></button>
  <button class="tab" id="tab-btn-ranking" onclick="switchTab('ranking')">🏅 <span data-i18n="tab_ranking">ランキング</span></button>
  <button class="tab" id="tab-btn-chart" onclick="switchTab('chart')">📊 <span data-i18n="tab_chart">グラフ</span></button>
  <button class="tab" id="tab-btn-tier" onclick="switchTab('tier')">🎯 Tier</button>
  <button class="tab" id="tab-btn-help" onclick="switchTab('help')">❓ <span data-i18n="tab_help">使い方</span></button>
</div>
<div id="tab-session"><div id="session-area"></div></div>
<div id="tab-courses" style="display:none">
  <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;flex-wrap:wrap;gap:8px">
    <div class="sec-lbl">コース戦績</div>
    <button class="save-btn" onclick="openRoadModal()">＋ 道を追加</button>
  </div>
  <div id="courses-accordion"></div>
</div>
<div id="tab-matches" style="display:none">
  <div class="sec-lbl" style="margin-bottom:12px">試合履歴（最新順）</div>
  <div id="match-list"></div>
</div>
<div id="tab-ranking" style="display:none">
  <div class="sec-lbl" style="margin-bottom:10px">コース別ランキング</div>
  <div class="sort-bar">
    <button class="sort-btn on" onclick="setSort('avg')">平均順位が良い順</button>
    <button class="sort-btn" onclick="setSort('rate')">入賞率が高い順</button>
    <button class="sort-btn" onclick="setSort('tries')">試行回数が多い順</button>
  </div>
  <div id="rank-list"></div>
</div>
<div id="tab-chart" style="display:none">
  <div class="sec-lbl" style="margin-bottom:10px" id="chart-avg-title">平均順位（低いほど良い）</div>
  <div id="chart-avg" style="margin-bottom:1.5rem"></div>
  <div class="sec-lbl" style="margin-bottom:10px" id="chart-rate-title">入賞率（%）</div>
  <div id="chart-rate"></div>
</div>
<div id="tab-tier" style="display:none">
  <div id="tier-analysis"></div>
</div>
<div id="tab-help" style="display:none">
  <div id="help-content"></div>
</div>
<div class="save-bar">
  <button class="save-btn" onclick="exportData()">💾 データを保存</button>
  <label class="save-btn" style="cursor:pointer"><span id="import-label-text">📂 データを読込</span><input type="file" id="import-file" accept=".json" style="display:none" onchange="importData(this)"></label>
</div>
</div>

<div id="modal-setup" class="mbg" style="display:none" onclick="closeMBg('modal-setup',event)">
  <div class="modal" style="width:380px">
    <div class="modal-title" id="setup-modal-title">キャラクターを選択</div>
    <div class="modal-note" id="setup-modal-note">使用するキャラクターを選んでください。</div>
    <div class="modal-setup-grid" id="setup-modal-grid"></div>
    <div class="mact" style="margin-top:1rem">
      <button class="bc" onclick="closeM('modal-setup')">閉じる</button>
    </div>
  </div>
</div>
<div id="modal-road" class="mbg" style="display:none" onclick="closeMBg('modal-road',event)">
  <div class="modal">
    <div class="modal-title">🛣️ 道コースを追加</div>
    <div class="modal-note">始点と終点を選択してください。</div>
    <div class="fr"><label class="fl">始点コース</label><select id="road-from"></select></div>
    <div class="fr"><label class="fl">終点コース</label><select id="road-to"></select></div>
    <div class="fr"><label class="fl">道の名前（省略可）</label><input type="text" id="road-name" placeholder="例: マリサ→クッパ 道"></div>
    <div class="fr"><label class="fl">絵文字（省略可）</label><input type="text" id="road-emoji" placeholder="🛣️"></div>
    <div class="mact"><button class="bc" onclick="closeM('modal-road')">キャンセル</button><button class="bs" onclick="saveRoad()">追加</button></div>
  </div>
</div>


<div id="modal-edit" class="mbg" style="display:none" onclick="closeMBg('modal-edit',event)">
  <div class="modal" style="width:380px">
    <div class="modal-title">✏️ 試合を訂正</div>
    <div class="modal-note">順位・キャラ・マシン・Tier・日付を変更できます。変更後「保存」してください。</div>
    <div id="edit-race-list"></div>
    <div class="fr" style="margin-top:12px">
      <label class="fl" id="edit-char-label">キャラクター</label>
      <select id="edit-char" style="width:100%;font-size:13px;padding:8px 10px;border:1.5px solid var(--border2);border-radius:var(--radius);background:var(--bg2);color:var(--text);font-family:var(--font)"></select>
    </div>
    <div class="fr">
      <label class="fl" id="edit-kart-label">マシン</label>
      <select id="edit-kart" style="width:100%;font-size:13px;padding:8px 10px;border:1.5px solid var(--border2);border-radius:var(--radius);background:var(--bg2);color:var(--text);font-family:var(--font)"></select>
    </div>
    <div class="fr"><label class="fl" id="edit-memo-label">試合メモ</label>
    <input type="text" id="edit-memo" placeholder="メモ（任意）"></div>
    <div class="fr"><label class="fl" id="edit-tier-label">Tier</label>
    <div class="tier-picker" id="edit-tier-picker"></div></div>
    <div class="fr"><label class="fl" id="edit-date-label">日付</label><input type="date" id="edit-date"></div>
    <div class="mact">
      <button class="bc" onclick="closeM('modal-edit')">キャンセル</button>
      <button class="bs-r" onclick="deleteMatch()" style="margin-right:auto">試合を削除</button>
      <button class="bs" onclick="saveEditMatch()">保存</button>
    </div>
  </div>
</div>

// 道中コース インライン小サムネHTML（ランキング・グラフ用）
function roadThumbInlineHtml(c, w, h, r){
  var fromC=getAllCourses().find(function(x){return x.id===c.fromId;});
  var toC=getAllCourses().find(function(x){return x.id===c.toId;});
  var bgSrc=toC?(courseImages[toC.id]||defaultImgPath(toC)):null;
  var fgSrc=fromC?(courseImages[fromC.id]||defaultImgPath(fromC)):null;
  var rad=r||'4px';
  var style='position:relative;display:inline-block;width:'+w+'px;height:'+h+'px;border-radius:'+rad+';overflow:hidden;flex-shrink:0;vertical-align:middle';
  if(!bgSrc&&!fgSrc){
    return '<div style="'+style+';background:var(--bg2);display:inline-flex;align-items:center;justify-content:center;font-size:'+(Math.round(h*0.6))+'px">🛣️</div>';
  }
  var bgStyle='width:100%;height:100%;object-fit:cover;object-position:right center;display:block';
  var fgStyle='position:absolute;top:0;left:0;width:50%;height:100%;object-fit:cover;object-position:left center;border-right:1.5px solid rgba(255,255,255,0.65)';
  return '<div style="'+style+'">'
    +(bgSrc?'<img style="'+bgStyle+'" src="'+bgSrc+'" alt="">':'<div style="width:100%;height:100%;background:var(--bg2)"></div>')
    +(fgSrc?'<img style="'+fgStyle+'" src="'+fgSrc+'" alt="">':'')
    +'</div>';
}
// 道中コース CSS重ね合わせサムネ
function roadThumbHtml(c, cls){
  var fromC=getAllCourses().find(function(x){return x.id===c.fromId;});
  var toC=getAllCourses().find(function(x){return x.id===c.toId;});
  var bgSrc=toC?(courseImages[toC.id]||defaultImgPath(toC)):null;
  var fgSrc=fromC?(courseImages[fromC.id]||defaultImgPath(fromC)):null;
  if(!bgSrc&&!fgSrc){
    // 両方なし: プレースホルダー
    return '<div class="'+(cls||'cp-thumb-ph')+'" style="background:'+(c.color||'#333')+'22;aspect-ratio:600/315;display:flex;align-items:center;justify-content:center;font-size:22px">🛣️</div>';
  }
  if(!bgSrc){
    // 終点なし: 始点のみ
    return '<div class="road-img-wrap"><img class="road-img-bg" src="'+fgSrc+'" alt="'+cN(c)+'"></div>';
  }
  var fgHtml=fgSrc?'<img class="road-img-fg" src="'+fgSrc+'" alt="">':'';
  return '<div class="road-img-wrap"><img class="road-img-bg" src="'+bgSrc+'" alt="'+cN(c)+'">'+fgHtml+'</div>';
}
function thumbHtml(c,cls='cthumb',phCls='cthumb-ph'){
  if(c.isRoad)return roadThumbHtml(c,cls);
  var img=courseImages[c.id]||defaultImgPath(c);
  if(img)return '<img class="'+cls+'" src="'+img+'" alt="'+cN(c)+'">';
  return '<div class="'+phCls+'" style="background:'+(c.color||'#333')+'22">'+c.emoji+'</div>';
}

function renderMetrics(){
  const allRecs=Object.values(courseRecords).flat();
  const total=allRecs.length,topHalf=allRecs.filter(r=>r.rank<=topN).length;
  const topRate=total?Math.round(topHalf/total*100):0;
  const avgs=Object.values(courseRecords).filter(r=>r.length>0).map(r=>r.reduce((s,x)=>s+x.rank,0)/r.length);
  const overallAvg=avgs.length?(avgs.reduce((a,b)=>a+b,0)/avgs.length).toFixed(1):'--';
  const tm=matchHistory.length;
  const avgPts=tm?(matchHistory.reduce((s,m)=>s+m.totalPts,0)/tm).toFixed(1):'--';
  document.getElementById('metrics').innerHTML=''
    +'<div class="mc"><div class="mc-lbl">'+t('metrics_matches')+'</div><div class="mc-val">'+tm+'</div><div class="mc-sub">'+t('metrics_recorded')+'</div></div>'
    +'<div class="mc"><div class="mc-lbl">'+t('metrics_avg_pts')+'</div><div class="mc-val">'+avgPts+'</div><div class="mc-sub">'+t('metrics_per_match')+'</div></div>'
    +'<div class="mc"><div class="mc-lbl">'+t('metrics_avg_rank')+'</div><div class="mc-val">'+overallAvg+'</div><div class="mc-sub">'+t('metrics_players')+'</div></div>'
    +'<div class="mc"><div class="mc-lbl">'+topN+t('metrics_top_rate')+'</div><div class="mc-val">'+topRate+'%</div><div class="mc-sub">'+topHalf+'/'+total+(lang==='en'?' races':' レース')+'</div></div>';
}

      +rankPill(r.rank)
      +'<div class="race-pts">+'+pts(r.rank)+'pt</div>'
      +(isEditing?'<span style="font-size:9px;font-weight:700;color:var(--yellow);padding:2px 5px;border:1px solid var(--yellow);border-radius:4px">修正中</span>':'')
      +'<button class="race-del" onclick="event.stopPropagation();deleteRace('+i+')">✕</button>'
      +'</div>';
  }).join('');
  let summaryHtml='';
  if(done>0){
    const top12=races.filter(r=>r.rank<=topN).length;
    const avgRank=(races.reduce((s,r)=>s+r.rank,0)/done).toFixed(1);
    summaryHtml='<div class="session-summary">'
      +'<div><div class="ss-item">'+(lang==='en'?'Total':'合計得点')+'</div><div class="ss-val" style="color:#F5C518">'+totalPts+'pt</div></div>'
      +'<div><div class="ss-item">'+(lang==='en'?'Avg Rank':'平均順位')+'</div><div class="ss-val">'+avgRank+(lang==='en'?'':'位')+'</div></div>'
      +'<div><div class="ss-item">'+topN+(lang==='en'?'+':'位以上')+'</div><div class="ss-val">'+top12+'/'+done+(lang==='en'?' races':'レース')+'</div></div>'

  // Tier picker（常時表示）

  let pickerHtml='';
  if(done<12||selEditRaceIdx!==null){

    const allForPicker=getAllCourses().filter(c=>!c.isRoad||(tempRoad&&c.id===tempRoad.id));
    const sortedCourses=allForPicker.slice().sort(kanaSort);
    const courseCards=sortedCourses.map(c=>{
      const isUsed=used.has(c.id);
      var th=thumbHtml(c,'cp-thumb','cp-thumb-ph');
      var roadCls='';
      var roadDim=false;
      if(roadMode){
        if(roadFrom===c.id) roadCls=' road-from-sel';
        else if(roadTo===c.id) roadCls=' road-to-sel';
        else if(roadFrom){
          // 始点選択済み：接続先テーブルにないコースはdim
          var allowed=ROAD_CONNECTIONS[roadFrom]||[];
          if(allowed.length>0&&!allowed.includes(c.id)) roadDim=true;
        } else if(!roadFrom&&c.id==='rainbow_road'){
          // 始点未選択時：レインボーロードはdim（始点不可）
          roadDim=true;
        }
      }
      // tempRoad: 選択中の道を強調表示
      var isTempSel=tempRoad&&c.id===tempRoad.id;
      var normalSel=(!roadMode&&(selCourseId===c.id||isTempSel))?' cp-sel':'';
      var tempBadge=isTempSel?'<div class="cp-road-lbl" style="background:rgba(159,225,203,.9);color:#001a10">✓ '+(lang==="en"?'INTR':'道')+'</div>':'';
      var dimStyle=roadDim?'opacity:.25;pointer-events:none;':'';
      return '<div class="cp-card'+(c.isRoad?' road-type':'')+normalSel+roadCls+(isUsed?' used':'')+'" data-pick-course="'+c.id+'" style="cursor:pointer;'+dimStyle+'">'
        +th
        +'<div class="cp-name">'+cN(c)+'</div>'
        +(isUsed&&!roadMode?'<div class="cp-warn">⚠ '+( lang==='en'?'Already used':'選択済み')+'</div>':'')
        +(c.isRoad&&!isTempSel?'<div class="cp-road-lbl">'+(lang==="en"?'INTR':'道')+'</div>':'')
        +tempBadge
        +'</div>';
    }).join('');

    // 道モードバー
    var fromC=roadFrom?getAllCourses().find(c=>c.id===roadFrom):null;
    var toC=roadTo?getAllCourses().find(c=>c.id===roadTo):null;
    var roadModeBar='<div class="road-mode-bar">'
      +'<button class="road-mode-btn'+(roadMode?' on':'')+'" onclick="toggleRoadMode()">'+t('road_mode')+'</button>'
      +(roadMode
        ?('<span class="road-mode-step">'
          +'<span class="road-sel-from'+(fromC?' filled':'')+'">'+t('road_from')+' '+(fromC?'<img class="road-sel-img" src="'+(courseImages[fromC.id]||defaultImgPath(fromC))+'" alt="'+cN(fromC)+'">&nbsp;'+cN(fromC):t('road_unsel'))+'</span>'
          +' → '
          +'<span class="road-sel-to'+(toC?' filled':'')+'">'+t('road_to')+' '+(toC?'<img class="road-sel-img" src="'+(courseImages[toC.id]||defaultImgPath(toC))+'" alt="'+cN(toC)+'">&nbsp;'+cN(toC):t('road_unsel'))+'</span>'
          +(fromC&&toC?(' <button class="add-race-btn" style="width:auto;margin:0;padding:5px 14px;font-size:12px" onclick="commitRoad()">'+t('road_add_btn')+'</button>'):'')
          +'</span>')
        :('<span style="font-size:11px;color:var(--text3)">'+t('road_off_hint')+'</span>'))
      +'</div>';

    let rankGridHtml='';
    for(let r=1;r<=24;r++){
      const cls=r<=3?'top3':r<=topN?'top12':'';
      var rSel=selRank===r?' rk-sel':'';
      rankGridHtml+='<button class="rank-btn '+cls+rSel+'" onclick="pickRank('+r+')">'+r+'</button>';
    }
    const canAdd=!roadMode&&selCourseId&&selRank;
    const selC=canAdd?getAllCourses().find(c=>c.id===selCourseId):null;
    var selCImg=canAdd&&selC?(courseImages[selC.id]||defaultImgPath(selC)):null;
    var selCThumb=selCImg?('<img style="width:32px;height:18px;object-fit:cover;border-radius:3px;vertical-align:middle;margin-right:4px" src="'+selCImg+'" alt="'+cN(selC)+'">'):'' ;
    var isEditMode=selEditRaceIdx!==null;
    var addBtnLabel=canAdd
      ?(isEditMode
        ?(selCThumb+' Race '+(selEditRaceIdx+1)+' を修正 → ＋'+pts(selRank)+'pt')
        :(selCThumb+' Race '+(done+1)+' ＋'+pts(selRank)+'pt'))
      :(isEditMode?'コースと順位を選んで修正':t('session_add_btn'));

    // Selected course indicator
    var selCObj=selCourseId?getAllCourses().find(function(c){return c.id===selCourseId;}):null;
    var selIndicator='';
    if(selCObj){
      var selThumb;
      if(selCObj.isRoad){
        var _fc=getAllCourses().find(function(x){return x.id===selCObj.fromId;});
        var _tc=getAllCourses().find(function(x){return x.id===selCObj.toId;});
        var _bg=_tc?(courseImages[_tc.id]||defaultImgPath(_tc)):null;
        var _fg=_fc?(courseImages[_fc.id]||defaultImgPath(_fc)):null;
        selThumb='<div style="position:relative;width:52px;height:27px;border-radius:5px;overflow:hidden;border:1.5px solid var(--yellow);flex-shrink:0">'
          +(_bg?'<img style="width:100%;height:100%;object-fit:cover;object-position:right center" src="'+_bg+'" alt="">':'')
          +(_fg?'<img style="position:absolute;top:0;left:0;width:50%;height:100%;object-fit:cover;object-position:left center;border-right:1.5px solid rgba(255,255,255,.65)" src="'+_fg+'" alt="">':'')
          +'</div>';
      } else {
        var _si=courseImages[selCObj.id]||defaultImgPath(selCObj);
        selThumb=_si?('<img style="width:52px;height:27px;object-fit:cover;border-radius:5px;border:1.5px solid var(--yellow);flex-shrink:0" src="'+_si+'" alt="'+cN(selCObj)+'">')
          :('<div style="width:52px;height:27px;background:'+(selCObj.color||'#333')+'33;border-radius:5px;border:1.5px solid var(--yellow);display:flex;align-items:center;justify-content:center;font-size:14px;flex-shrink:0">?</div>');
      }
      selIndicator='<div style="display:flex;align-items:center;gap:8px;padding:7px 12px;background:rgba(245,197,24,.08);border:1.5px solid var(--yellow);border-radius:var(--radius);margin-bottom:8px">'
        +'<span style="font-size:10px;font-weight:700;color:var(--text3);letter-spacing:.5px;text-transform:uppercase">'+(lang==='en'?'Selected Track:':'選択中:')+'</span>'
        +selThumb
        +'<span style="font-size:12px;font-weight:800;color:var(--yellow)">'+cN(selCObj)+'</span>'
        +(selCObj.isRoad?'<span style="font-size:9px;font-weight:700;color:#9FE1CB;padding:2px 6px;border:1px solid #9FE1CB;border-radius:4px">'+(lang==='en'?'INTR':'道')+'</span>':'')
        +'</div>';
    }
    pickerHtml=roadModeBar
      +selIndicator
      +'<div class="picker-label">Race '+(done+1)+' — '+t('session_course_label')+'</div>'
      +'<div class="course-picker-grid">'+courseCards+'</div>'
      +(roadMode
        ?''
        :('<div class="picker-label">'+t('session_rank_label')+'</div>'
          +'<div class="rank-grid">'+rankGridHtml+'</div>'
          +'<div id="dup-warn" style="margin-top:8px;padding:7px 12px;background:rgba(196,36,45,.15);border:1px solid #c4242d;border-radius:8px;font-size:11px;font-weight:700;color:#ff8080;text-align:center;opacity:0;transition:opacity .3s">'+t('dup_warn')+'</div>'
          +'<button class="add-race-btn" onclick="addRace()"'+(canAdd?'':' disabled')+'>'+addBtnLabel+'</button>'));
  } else {
    pickerHtml='<div style="padding:10px 14px;background:rgba(46,170,74,.1);border:1px solid var(--green);border-radius:var(--radius);font-size:12px;font-weight:700;color:#5dca8a;text-align:center;margin-top:10px">'+t('session_done')+'</div>';
  }

  var canFinish=done===12&&selTier;
  var finishBtnLabel=canFinish?t('session_finish'):t('session_finish_wait');
  var finishBtnStyle=canFinish?'':'opacity:.4;cursor:default;animation:none';
  var finishBtn=done===12?('<button class="finish-btn" onclick="finishSession()"'+(canFinish?'':' disabled')+' style="'+finishBtnStyle+'">'+finishBtnLabel+'</button>'):'';
  var memoHtml='<div style="margin-top:14px"><div class="picker-label">'+t('session_memo_label')+'</div>'
    +'<textarea id="session-memo" rows="2" style="width:100%;font-size:12px;padding:8px 10px;border:1.5px solid var(--border2);border-radius:var(--radius);background:var(--bg2);color:var(--text);resize:vertical;font-family:var(--font);outline:none" placeholder="'+t('session_memo_ph')+'" oninput="session.memo=this.value">'+(session.memo||'')+'</textarea></div>';
  var cancelBtn='<button class="reset-btn" onclick="cancelSession()"'+(done===0?' disabled style="opacity:.35;cursor:default"':'')+'>'+t('session_reset')+'</button>';

  document.getElementById('session-area').innerHTML=''
    +'<div class="session-panel">'
    +'<div class="session-hdr">'
    +'<div><div class="session-title">'+t('session_title')+'</div><div class="session-prog">'+done+' / 12 '+t('session_prog')+'</div></div>'
    +'<div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">'
    +cancelBtn
    +'<input type="date" value="'+session.date+'" onchange="session.date=this.value" style="font-size:12px;padding:6px 8px;border:1.5px solid var(--border2);border-radius:8px;background:var(--bg2);color:var(--text);font-family:var(--font)">'
    +'</div></div>'
    +'<div class="progress-bar"><div class="progress-fill" style="width:'+Math.round(done/12*100)+'%"></div></div>'
    +setupPanelHtml
    +tierHtml
    +summaryHtml
    +'<div>'+(raceListHtml||'<div class="empty" style="padding:1rem">'+t('session_first')+'</div>')+'</div>'
    +pickerHtml
    +memoHtml
    +'</div>'
    +finishBtn;
  // コースピッカーのスクロール位置を復元
  if(_cpScrollTop>0){
    var _cpGridNew=document.querySelector('.course-picker-grid');
    if(_cpGridNew)_cpGridNew.scrollTop=_cpScrollTop;
  }
}

function pickTier(tier){selTier=tier;renderSession();autoSave();}
function toggleRoadMode(){
  roadMode=!roadMode;
  roadFrom=null;roadTo=null;
  renderSession();
}
function commitRoad(){
  if(!roadFrom||!roadTo)return;
  var fromC=getAllCourses().find(c=>c.id===roadFrom);
  var toC=getAllCourses().find(c=>c.id===roadTo);
  if(!fromC||!toC){alert(lang==='en'?'Track not found':'コースが見つかりません');return;}
  var exists=customRoads.find(r=>r.fromId===roadFrom&&r.toId===roadTo);
  var roadObj;
  if(exists){
    roadObj=exists;
  } else {
    // 命名規則: 始点の頭4文字→終点の頭4文字
    var fromShort=cShort(fromC);
    var toShort=cShort(toC);
    var autoName=fromShort+'→'+toShort;
    var promptMsg=lang==='en'?'Intermission name (optional):':'道の名前（省略可）:';
    var name=prompt(promptMsg,autoName)||autoName;
    var id='road_'+roadFrom+'_'+roadTo+'_'+Date.now();
    roadObj={id:id,name:name,nameEn:name,emoji:'',color:'#9FE1CB',isRoad:true,cup:'道',cupEn:'Intermission',fromId:roadFrom,toId:roadTo,fromName:fromC.name,toName:toC.name};
    customRoads.push(roadObj);
    courseRecords[id]=[];
    renderCourseGrid();
  }
  // 道モードOFF・tempRoadに設定して通常モードへ・作成した道を自動選択
  roadMode=false;roadFrom=null;roadTo=null;
  tempRoad=roadObj;
  selCourseId=roadObj.id;selRank=null;
  renderSession();autoSave();
  setTimeout(()=>{const el=document.querySelector('.rank-grid');if(el)el.scrollIntoView({behavior:'smooth',block:'nearest'});},80);
}
function pickCourse(id){
  if(roadMode){
    if(!roadFrom){
      if(id==='rainbow_road'&&!roadFrom){return;} // 始点からレインボーロードを除外
      roadFrom=id;
      renderSession();
    } else if(!roadTo){
      if(id===roadFrom){roadFrom=null;renderSession();return;}
      // 接続先に含まれないコースはタップ無効
      var allowed=ROAD_CONNECTIONS[roadFrom]||[];
      if(allowed.length>0&&!allowed.includes(id))return;
      roadTo=id;
      renderSession();
    } else {
      // 両方選択済み → 再選択
      roadFrom=id;roadTo=null;
      renderSession();
    }
    return;
  }
  const isUsed=getUsedIds().has(id);
  selCourseId=id;
  renderSession();
  autoSave();
  if(isUsed){
    const warn=document.getElementById('dup-warn');
    if(warn){warn.style.opacity='1';setTimeout(()=>{warn.style.opacity='0';},2200);}
  }
  setTimeout(()=>{const el=document.querySelector('.rank-grid');if(el)el.scrollIntoView({behavior:'smooth',block:'nearest'});},50);
}
function pickRank(r){selRank=r;renderSession();autoSave();}
function startEditRace(idx){
  if(selEditRaceIdx===idx){cancelEditRace();return;}
  var r=session.races[idx];
  selEditRaceIdx=idx;
  selCourseId=r.courseId;
  selRank=r.rank;
  renderSession();
  setTimeout(()=>{var el=document.querySelector('.course-picker-grid');if(el)el.scrollIntoView({behavior:'smooth',block:'nearest'});},50);
}
function cancelEditRace(){selEditRaceIdx=null;selCourseId=null;selRank=null;renderSession();}
function addRace(){
  if(!selCourseId||!selRank)return;
  if(selEditRaceIdx!==null){
    // 修正モード: 既存レースを上書き
    session.races[selEditRaceIdx]={courseId:selCourseId,rank:selRank};
    selEditRaceIdx=null;
  } else {
    session.races.push({courseId:selCourseId,rank:selRank});
  }
  selCourseId=null;selRank=null;tempRoad=null;
  renderSession();autoSave();
}
function deleteRace(idx){session.races.splice(idx,1);selCourseId=null;selRank=null;tempRoad=null;selEditRaceIdx=null;renderSession();autoSave();}
function finishSession(){
  if(session.races.length!==12){alert(lang==='en'?'Please enter 12 races.':'12レース分の入力が必要です');return;}
  const totalPts=session.races.reduce((s,r)=>s+pts(r.rank),0);
  const match={id:Date.now(),date:session.date,races:[...session.races],totalPts,tier:selTier,charId:selChar,kartId:selKart,memo:session.memo||'',topN};
  matchHistory.unshift(match);
  session.races.forEach(r=>{if(!courseRecords[r.courseId])courseRecords[r.courseId]=[];courseRecords[r.courseId].push({rank:r.rank,date:session.date,memo:(lang==='en'?'Match #':'試合 #')+matchHistory.length});});
  session={races:[],date:new Date().toISOString().slice(0,10),memo:''};
  selCourseId=null;selRank=null;selTier=null;tempRoad=null;
  autoSave();renderMetrics();renderSession();
  alert(lang==='en'?'🏆 Match saved! Total: '+totalPts+' pt':'🏆 試合を記録しました！ 合計 '+totalPts+' pt');
}
function cancelSession(){if(session.races.length===0&&!selTier&&!selCourseId)return;if(!confirm(lang==='en'?'Reset this match?':'リセットしますか？'))return;session={races:[],date:new Date().toISOString().slice(0,10),memo:''};selCourseId=null;selRank=null;selTier=null;roadMode=false;roadFrom=null;roadTo=null;tempRoad=null;selEditRaceIdx=null;renderSession();autoSave();}

function renderCourseGrid(){
  var courses=getAllCourses().slice().sort(kanaSort);
  var html='';
  courses.forEach(function(c){
    var sel=selCourse===c.id?' sel':'';
    var isOpen=selCourse===c.id;
    html+='<div class="course-row">';
    // カード
    html+='<div class="ccard'+(c.isRoad?' road-type':'')+sel+'" data-course-id="'+c.id+'">';
    // 左: サムネ（cthumb-wrap でラップ）
    html+='<div class="cthumb-wrap">';
    html+=thumbHtml(c,'cthumb','cthumb-ph');
    html+=(c.isRoad?'<div class="road-badge">'+(lang==="en"?'INTR':'道')+'</div>':'');
    html+='</div>';
    // 右: テキスト情報
    html+='<div class="cinfo"><div class="cname">'+cN(c)+'</div>';
    html+='<div class="cmeta">'+badgeForCourse(c.id)+'</div></div></div>';
    // accordion detail
    html+='<div class="course-row-detail'+(isOpen?' open':'')+'" id="detail-'+c.id+'">';
    if(isOpen) html+=buildDetailHTML(c.id);
    html+='</div>';
    html+='</div>';
  });
  document.getElementById('courses-accordion').innerHTML=html;
}
function selectCourse(id){
  // 同じコースをクリックしたら閉じる
  if(selCourse===id){
    selCourse=null;
    var prevDetail=document.getElementById('detail-'+id);
    if(prevDetail){prevDetail.classList.remove('open');prevDetail.innerHTML='';}
    var prevCard=document.querySelector('[data-course-id="'+id+'"]');
    if(prevCard)prevCard.classList.remove('sel');
    return;
  }
  // 前の選択を閉じる
  if(selCourse){
    var oldDetail=document.getElementById('detail-'+selCourse);
    if(oldDetail){oldDetail.classList.remove('open');oldDetail.innerHTML='';}
    var oldCard=document.querySelector('[data-course-id="'+selCourse+'"]');
    if(oldCard)oldCard.classList.remove('sel');
  }
  selCourse=id;
  var card=document.querySelector('[data-course-id="'+id+'"]');
  if(card)card.classList.add('sel');
  var det=document.getElementById('detail-'+id);
  if(!det)return;
  det.innerHTML=buildDetailHTML(id);
  det.classList.add('open');
  // カードが見えるようにスクロール（画面外の場合のみ）
  setTimeout(function(){
    var rect=card.getBoundingClientRect();
    if(rect.top<0||rect.bottom>window.innerHeight){
      card.scrollIntoView({behavior:'smooth',block:'nearest'});
    }
  },50);
  // イベント委任
  det.onclick=function(e){
    var delRoad=e.target.closest('[data-del-road]');
    if(delRoad){deleteRoad(delRoad.getAttribute('data-del-road'));return;}
  };
}

function buildDetailHTML(id){
  var c=getAllCourses().find(function(x){return x.id===id;});
  if(!c)return'';
  var recs=courseRecords[id]||[];
  var s=stats(recs);
  var iconHtml;
  if(c.isRoad){
    var _dfc=getAllCourses().find(function(x){return x.id===c.fromId;});
    var _dtc=getAllCourses().find(function(x){return x.id===c.toId;});
    var _dbg=_dtc?(courseImages[_dtc.id]||defaultImgPath(_dtc)):null;
    var _dfg=_dfc?(courseImages[_dfc.id]||defaultImgPath(_dfc)):null;
    iconHtml='<div style="position:relative;width:80px;height:42px;border-radius:8px;overflow:hidden;border:1.5px solid var(--border);flex-shrink:0">'
      +(_dbg?'<img style="width:100%;height:100%;object-fit:cover;object-position:right center" src="'+_dbg+'" alt="">':'<div style="width:100%;height:100%;background:var(--bg2)"></div>')
      +(_dfg?'<img style="position:absolute;top:0;left:0;width:50%;height:100%;object-fit:cover;object-position:left center;border-right:1.5px solid rgba(255,255,255,.5)" src="'+_dfg+'" alt="">':'')
      +'</div>';
  } else {
    var _img=courseImages[id]||defaultImgPath(c);
    iconHtml=_img
      ?('<img class="d-thumb" src="'+_img+'" alt="'+cN(c)+'">')
      :('<div style="width:80px;height:42px;background:'+(c.color||'#333')+'22;border-radius:8px;border:1.5px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:22px">'+c.emoji+'</div>');
  }
  var histHtml=recs.length?recs.slice().reverse().map(function(r,i){
    return '<div class="hist-row">'
      +'<div class="h-num">'+(recs.length-i)+'</div>'
      +rankPill(r.rank)
      +'<div class="h-date">'+r.date+(r.memo?' — '+r.memo:'')+'</div>'
      +'</div>';
  }).join(''):('<div class="empty">'+(lang==="en"?'No data yet':'まだ記録がありません')+'</div>');
  var roadInfo=c.isRoad
    ?('<div style="font-size:11px;color:var(--text2);margin-bottom:.75rem;display:flex;gap:6px;align-items:center;background:var(--bg2);padding:6px 10px;border-radius:8px;border:1px solid var(--border)">'
      +'<span style="font-weight:700">'+c.fromName+'</span><span>→</span><span style="font-weight:700">'+c.toName+'</span>'
      +'<button class="del-btn" data-del-road="'+id+'" style="margin-left:auto">'+(lang==="en"?'Delete':'道を削除')+'</button>'
      +'</div>')
    :'';
  var statsHtml='';
  if(s){
    statsHtml='<div class="dstats">'
      +(lang==='en'

var _memoSaveTimer={};
function saveCourseMemoDraft(id){
  var ta=document.getElementById('course-memo-'+id);
  if(!ta)return;
  courseMemos[id]=ta.value;
  // デバウンス: 800ms 後に autoSave + ✓表示
  clearTimeout(_memoSaveTimer[id]);
  _memoSaveTimer[id]=setTimeout(function(){
    autoSave();
    var ok=document.getElementById('course-memo-saved-'+id);
    if(ok){ok.style.opacity='1';setTimeout(function(){ok.style.opacity='0';},1800);}
  },800);

function renderMatches(){
  if(!matchHistory.length){document.getElementById('match-list').innerHTML=(lang==='en'?'<div class="empty">No matches recorded yet.</div>':'<div class="empty">まだ試合の記録がありません</div>');return;}
  var maxPts=Math.max.apply(null,matchHistory.map(function(m){return m.totalPts;}));
  document.getElementById('match-list').innerHTML=matchHistory.map(function(m,i){
    var ptsClass=m.totalPts>=maxPts*0.75?'pts-high':m.totalPts>=maxPts*0.5?'pts-mid':'pts-low';
    var isExp=expandedMatch===m.id;
    var memoLine=m.memo?('<div style="font-size:11px;color:var(--text2);padding:6px 10px;background:var(--bg2);border-radius:6px;margin-top:6px;border-left:2px solid var(--border2)">📝 '+m.memo+'</div>'):'';
    var detailHtml='';
    if(isExp){
      var raceRows=m.races.map(function(r,ri){
        var c=getAllCourses().find(function(x){return x.id===r.courseId;});
        return '<div class="match-race-row">'
          +'<span style="width:24px;font-weight:700;font-family:var(--font-mk)">'+(ri+1)+'</span>'
          +'<span style="flex:1;display:flex;align-items:center;gap:4px">'+(c?thumbMini(c)+' '+cN(c):(lang=='en'?'Unknown':'不明'))+'</span>'
          +rankPill(r.rank)
          +'<span style="width:40px;text-align:right;color:var(--yellow);font-weight:700">+'+pts(r.rank)+'pt</span>'
          +'</div>';
      }).join('');
      detailHtml='<div class="match-detail">'+raceRows+'</div>';
    }
    var tierBadge=m.tier?('<span class="tier-badge tier-'+m.tier+'" style="margin-left:6px">'+m.tier+'</span>'):'';
    var ch=chars.find(function(c){return c.id===m.charId;});
    var kt=karts.find(function(k){return k.id===m.kartId;});
    var chSrc=ch?(charImages[ch.id]||charImgPath(ch)):null;
    var ktSrc=kt?(kartImages[kt.id]||kartImgPath(kt)):null;
    var chHtml=ch?(chSrc?'<img src="'+chSrc+'" style="width:16px;height:16px;object-fit:cover;border-radius:3px;vertical-align:middle"> ':ch.emoji+' '):'';
    var ktHtml=kt?(ktSrc?'<img src="'+ktSrc+'" style="width:16px;height:16px;object-fit:cover;border-radius:3px;vertical-align:middle"> ':kt.emoji+' '):'';
    var parts=[ch?(chHtml+chrN(ch)):'',kt?(ktHtml+ktN(kt)):''].filter(Boolean);
    var charKartStr=parts.length?' · '+parts.join(' / '):'';
    var avgRankStr=(m.races.reduce(function(s,r){return s+r.rank;},0)/m.races.length).toFixed(1);
    var top12cnt=m.races.filter(function(r){return r.rank<=topN;}).length;
    return '<div class="match-card" onclick="toggleMatch('+m.id+')">'
      +'<div class="match-hdr">'
      +'<div style="display:flex;align-items:center;flex-wrap:wrap;gap:4px">'
      +'<span class="match-no">'+(lang==="en"?"Match #":"試合 #")+(matchHistory.length-i)+"</span>"
      +tierBadge
      +'<span style="font-size:11px;color:var(--text3);margin-left:2px">'+m.date+'</span>'
      +'</div>'
      +'<div style="display:flex;align-items:center;gap:8px">'
      +'<div class="match-pts '+ptsClass+'">'+m.totalPts+' pt</div>'
      +'<button class="save-btn" style="font-size:10px;padding:4px 8px" title="'+(lang==="en"?'Export this match':'この試合を保存')+'" onclick="event.stopPropagation();exportSingleMatch('+m.id+')">💾</button>'
      +'<button class="save-btn" style="font-size:10px;padding:4px 10px" onclick="event.stopPropagation();openEditMatch('+m.id+')">'+(lang==="en"?'✏️ Edit':'✏️ 訂正')+'</button>'
      +'</div></div>'
      +'<div class="match-sub">'+m.races.length+(lang==="en"?' races':'レース')+' · '+(lang==="en"?'Avg ':'平均')+avgRankStr+(lang==="en"?'':'位')+' · '+topN+(lang==="en"?'th+':'位以上')+top12cnt+'/'+m.races.length+(lang==="en"?' races':'レース')+charKartStr+'</div>'
      +memoLine+detailHtml
      +'</div>';
  }).join('');
}
function toggleMatch(id){expandedMatch=expandedMatch===id?null:id;renderMatches();}
function renderRanking(){
  var items=getAllCourses().map(function(c){return {c:c,s:stats(courseRecords[c.id]||[])};}).filter(function(x){return x.s;});
  if(sortMode==='avg')items.sort(function(a,b){return a.s.avg-b.s.avg;});
  if(sortMode==='rate')items.sort(function(a,b){return b.s.rate-a.s.rate;});
  if(sortMode==='tries')items.sort(function(a,b){return b.s.tries-a.s.tries;});
  var medals=['🥇','🥈','🥉'];
  var medalColors=['#F5C518','#85B7EB','#5dca8a'];
  document.getElementById('rank-list').innerHTML=items.length?items.map(function(item,i){
    var medal=medals[i]||('<span style="font-size:13px;font-weight:700;color:var(--text3)">'+(i+1)+'</span>');
    var valStr=sortMode==='avg'?item.s.avg.toFixed(1)+(lang==='en'?'':' 位'):sortMode==='rate'?Math.round(item.s.rate)+'%':item.s.tries+(lang==='en'?' times':'回');
    var subStr=sortMode!=='avg'?(lang==='en'?'Avg '+item.s.avg.toFixed(1):'平均 '+item.s.avg.toFixed(1)+'位'):(lang==='en'?'Win '+Math.round(item.s.rate)+'%':'入賞率 '+Math.round(item.s.rate)+'%');
    var color=medalColors[i]||'var(--text)';
    return '<div class="rnk-row">'
      +'<div style="font-size:16px;width:28px;text-align:center">'+medal+'</div>'
      +'<div style="flex-shrink:0">'+(item.c.isRoad?roadThumbInlineHtml(item.c,48,26,'4px'):('<img src="'+(courseImages[item.c.id]||defaultImgPath(item.c))+'" style="width:48px;height:26px;object-fit:cover;border-radius:4px;display:block" alt="'+cN(item.c)+'">' ))+'</div>'
      +'<div style="flex:1"><div style="font-size:12px;font-weight:700">'+cN(item.c)+'</div>'
      +'<div style="font-size:10px;color:var(--text3)">'+(lang=='en'&&item.c.cupEn?item.c.cupEn:item.c.cup)+' · '+item.s.tries+(lang=='en'?' tries':'回')+'</div></div>'
      +'<div style="text-align:right"><div style="font-size:14px;font-weight:800;font-family:var(--font-mk);color:'+color+'">'+valStr+'</div>'
      +'<div style="font-size:10px;color:var(--text3);margin-top:2px">'+subStr+'</div></div></div>';
  }).join(''):('<div class="empty">'+(lang==="en"?'No data yet':'まだ記録がありません')+'</div>');
}
function setSort(mode){
  sortMode=mode;
  document.querySelectorAll('.sort-btn').forEach(function(btn,i){btn.classList.toggle('on',['avg','rate','tries'][i]===mode);});
  renderRanking();
}
function renderChart(){
  var el=document.getElementById('chart-rate-title');
  if(el)el.textContent=lang==='en'?(topN+t('chart_rate_title')):(topN+'位以上入賞率（%）');
  var items=getAllCourses().map(function(c){return {c:c,s:stats(courseRecords[c.id]||[])};}).filter(function(x){return x.s;});
  var maxAvg=Math.max.apply(null,items.map(function(x){return x.s.avg;}).concat([1]));
  var sortedAvg=items.slice().sort(function(a,b){return a.s.avg-b.s.avg;});
  document.getElementById('chart-avg').innerHTML=sortedAvg.map(function(item){
    var thumbHtmlChart=item.c.isRoad?roadThumbInlineHtml(item.c,28,15,'2px'):('<img src="'+(courseImages[item.c.id]||defaultImgPath(item.c))+'" style="width:28px;height:15px;object-fit:cover;border-radius:2px;flex-shrink:0" alt="'+cN(item.c)+'">');
    return '<div class="bar-row"><div class="bar-lbl" style="display:flex;align-items:center;gap:4px">'+thumbHtmlChart+'<span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+cN(item.c)+'</span></div>'
      +'<div class="bar-track"><div class="bar-avg" style="width:'+Math.round(item.s.avg/maxAvg*100)+'%"></div></div>'
      +'<div class="bar-val">'+item.s.avg.toFixed(1)+(lang==="en"?'':'位')+'</div></div>';
  }).join('')||('<div class="empty">'+(lang==="en"?'No data yet':'まだ記録がありません')+'</div>');
  var sortedRate=items.slice().sort(function(a,b){return b.s.rate-a.s.rate;});
  document.getElementById('chart-rate').innerHTML=sortedRate.map(function(item){
    var thumbHtmlChart=item.c.isRoad?roadThumbInlineHtml(item.c,28,15,'2px'):('<img src="'+(courseImages[item.c.id]||defaultImgPath(item.c))+'" style="width:28px;height:15px;object-fit:cover;border-radius:2px;flex-shrink:0" alt="'+cN(item.c)+'">');
    return '<div class="bar-row"><div class="bar-lbl" style="display:flex;align-items:center;gap:4px">'+thumbHtmlChart+'<span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+cN(item.c)+'</span></div>'
      +'<div class="bar-track"><div class="bar-rate" style="width:'+Math.round(item.s.rate)+'%"></div></div>'
      +'<div class="bar-val">'+Math.round(item.s.rate)+'%</div></div>';
  }).join('')||('<div class="empty">'+(lang==="en"?'No data yet':'まだ記録がありません')+'</div>');
}
function openRoadModal(){
  var fromCourses=BASE_COURSES.filter(function(c){return c.id!=='rainbow_road';});
  var fromOpts=fromCourses.map(function(c){return '<option value="'+c.id+'">'+c.emoji+' '+cN(c)+'</option>';}).join('');
  var toOpts=BASE_COURSES.map(function(c){return '<option value="'+c.id+'">'+c.emoji+' '+cN(c)+'</option>';}).join('');

  document.getElementById('road-to').innerHTML=toOpts;

  document.getElementById('road-name').value='';

function saveRoad(){
  var fromId=document.getElementById('road-from').value;
  var toId=document.getElementById('road-to').value;
  if(fromId===toId){alert(lang==='en'?'From and To must be different.':'始点と終点が同じです');return;}
  var fromC=BASE_COURSES.find(function(c){return c.id===fromId;});
  var toC=BASE_COURSES.find(function(c){return c.id===toId;});
  var name=document.getElementById('road-name').value.trim()||(cShort(fromC)+'→'+cShort(toC));
  var id='road_'+fromId+'_'+toId+'_'+Date.now();
  var newRoad={id:id,name:name,nameEn:name,emoji:'',color:'#9FE1CB',isRoad:true,cup:'道',cupEn:'Intermission',fromId:fromId,toId:toId,fromName:fromC.name,toName:toC.name};
  customRoads.push(newRoad);
  courseRecords[id]=[];
  closeM('modal-road');renderCourseGrid();renderMetrics();renderSession();autoSave();
}
function deleteRoad(id){
  if(!confirm(lang==='en'?'Delete this intermission?':'削除しますか？'))return;
  customRoads=customRoads.filter(function(r){return r.id!==id;});
  delete courseRecords[id];delete courseImages[id];
  selCourse=null;
  renderCourseGrid();renderMetrics();autoSave();
}

function exportSingleMatch(matchId){
  var m=matchHistory.find(function(x){return x.id===matchId;});
  if(!m){alert(lang==='en'?'Match not found.':'試合が見つかりません。');return;}
  var data={singleMatch:true,match:m,exportedAt:new Date().toISOString()};
  var blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
  var a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='mkw_match_'+m.date+'_'+m.totalPts+'pt.json';a.click();

function importData(input){
  var file=input.files[0];if(!file)return;
  var reader=new FileReader();
  reader.onload=function(e){
    try{
      var data=JSON.parse(e.target.result);
      if(data.courseRecords)courseRecords=Object.assign({},courseRecords,data.courseRecords);
      if(data.matchHistory)matchHistory=data.matchHistory;
      if(data.customRoads){customRoads=data.customRoads;customRoads.forEach(function(r){if(!courseRecords[r.id])courseRecords[r.id]=[];});}
      if(data.chars)chars=data.chars;
      if(data.karts)karts=data.karts;
      // マスタ名称マイグレーション（importData用）
      var _removedKartIds=new Set(['bumble_v']);
      karts=karts.filter(function(k){return !_removedKartIds.has(k.id);});
      DEFAULT_CHARS.forEach(function(dc){var c=chars.find(function(x){return x.id===dc.id;});if(c){c.name=dc.name;c.nameEn=dc.nameEn;}});
      DEFAULT_KARTS.forEach(function(dk){var k=karts.find(function(x){return x.id===dk.id;});if(k){k.name=dk.name;k.nameEn=dk.nameEn;}});
      if(data.charImages)charImages=data.charImages;
      if(data.kartImages)kartImages=data.kartImages;
      // courseImages: 現在の.png/.avif画像を絵文字データで上書きしない
      if(data.courseImages){
        var newCourseImgs=data.courseImages;
        Object.keys(newCourseImgs).forEach(function(k){
          var incoming=newCourseImgs[k];
          var current=courseImages[k];
          // 現在が画像ファイルパス(.png/.avif)なら絵文字1文字データで上書きしない
          if(current&&(current.match(/\.(png|avif|jpg|jpeg|webp)$/i)||current.startsWith('data:image'))){
            // 入ってくるデータが絵文字（短い文字列でhttpでもdata:でもない）なら無視
            if(incoming&&!incoming.startsWith('http')&&!incoming.startsWith('data:')&&incoming.length<=10)return;
          }
          courseImages[k]=incoming;
        });
      }
      if(data.topN)topN=data.topN;
      selChar=chars.length>0?chars[0].id:null;
      selKart=karts.length>0?karts[0].id:null;
      selTier=null;selCourseId=null;selRank=null;
      session={races:[],date:new Date().toISOString().slice(0,10),memo:''};
      autoSave();
      renderMetrics();renderSession();renderCourseGrid();
      alert(lang==='en'?'Data imported!':'データを読み込みました！');
    }catch(err){alert(lang==='en'?'Import failed.':'読み込みに失敗しました。');}
  };
  reader.readAsText(file);input.value='';
}

    var img=imgs[item.id]||(isChar?charImgPath(item):kartImgPath(item));
